  '/v1/custom-rate/{customRateId}/review':
    post:
      tags:
        - Rates
      summary: Approve Custom Rate
      description: 'Partners can set up a unique, custom buy-rate for a unique managed seller, such as enterprise, mid-market, or a platform. To set up a custom rate, Afterpay teams will create a custom rate via internal Afterpay tooling.'
      operationId: reviewCustomRate
      parameters:
        - name: customRateId
          in: path
          required: true
          description: ID of the custom rate to approve
          schema:
            type: string
            example: '123457838'
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            default: application/json
          description: Content type of the request body.
        - in: header
          name: User-Agent
          required: true
          schema:
            type: string
          description: The user agent string of the HTTP client.
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          description: Specifies media types that are acceptable for the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customRateId
                - userDetails
                - comment
                - status
                - customRateType
                - merchantId
                - reference
                - rateDetails
              properties:
                customRateId:
                  type: string
                  example: '712123123556455'
                  description: The unique ID for the custom rate between Afterpay and the partner.
                userDetails:
                  $ref: '#/components/schemas/User'
                comment:
                  type: string
                  description: Comment specific to the custom rate request.
                  example: Approved by X on date Y for reason Z.
                status:
                  type: string
                  description: The de facto approval field that determines whether the rate request by Afterpay is approved or rejected by the partner.
                  example: APPROVED
                  enum:
                    - APPROVED
                    - REJECTED
                customRateType:
                  type: string
                  description: Defines whether the custom rate applies to only one seller or applies to multiple sellers under the same platform or brand.
                  example: MERCHANT
                  enum:
                    - MERCHANT
                    - BRAND
                merchantId:
                  type: string
                  description: Afterpay merchant id MID; this will only be available for existing sellers; for new sellers please use the reference field.
                  example: '100405604504'
                reference:
                  type: string
                  description: Seller or brand reference to which the custom rate is being applied; this defines the unique seller or the unique platform or brand and iswill be requested from the partner manually before the custom rate request is created.
                  example: 'ac_advkasdvasfbaadf:US'
                rateDetails:
                  type: object
                  required:
                    - countryCode
                    - rates
                  properties:
                    countryCode:
                      type: string
                      description: 'Country code in the two-letter ISO 3166-1 alpha-2 standard format, defining the consumer market for which the rate applies.'
                      example: US
                    rates:
                      type: array
                      items:
                        type: object
                        required:
                          - variableRatePercentage
                          - fixedRate
                          - fixedRateCurrencyCode
                          - rateType
                          - durationInMonths
                        properties:
                          variableRatePercentage:
                            type: number
                            description: Variable part of the buy-rate.
                            format: decimal
                            example: 5
                          fixedRate:
                            type: number
                            description: Fixed part of the buy-rate.
                            format: decimal
                            example: 0.3
                          fixedRateCurrencyCode:
                            type: string
                            description: Currency of the fixed part of the buy-rate.
                            example: USD
                          rateType:
                            type: string
                            description: INTRODUCTORY for temporary promotional rate or ONGOING for steady-state rate.
                            example: ONGOING
                            enum:
                              - INTRODUCTORY
                              - ONGOING
                          durationInMonths:
                            type: integer
                            description: Number of months that the introductory rate will be applied.
                            example: 3
      responses:
        '200':
          description: Custom rate reviewed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                    description: 'Datetime field indicating when the custom rate request was actioned, returned using the standard ISO 8601 format, in UTC Coordinated Universal Time).'
                    example: '2023-08-17T21:41:47.341+00:00'
                  error:
                    type: string
                    description: Shows any errors encountered on the response to the contract approval call.
                  message:
                    type: string
                    description: Any message that may be attached to the response.
                  customRateDetails:
                    $ref: '#/components/schemas/CustomRate'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response2'
        '401':
          description: 'Unauthorized, e.g., HMAC verification failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401Response'
        '404':
          description: Not Found - The specified resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404Response'
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
