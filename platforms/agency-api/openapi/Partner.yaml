openapi: 3.0.0
info:
  title: Afterpay Partner API
  description: |-
    API for creating an Afterpay account for merchants. Please contact your Afterpay technical representative about using this API.

    Client authentication is provided by setting the following request headers:
    - X-Afterpay-Request-Signature: \<Request Signature>
    - X-Afterpay-Request-Date: \<Request Date>
    - X-Afterpay-Request-Apikey: \<API Key>
    Note: More information on how to authenticate API requests [here](https://afterpay.docs.buildwithfern.com/afterpay-partner-api/guides/technical-guides/welcome/introduction).
  version: '1'
tags:
  - name: Partner
  - name: Onboardings
  - name: Capabilities
  - name: Rates
  - name: Settlements
servers:
  - url: 'https://agencyapi.afterpay.com'
    description: Production
  - url: 'https://agencyapi.sandbox.afterpay.com'
    description: Sandbox
paths:
  /v1/onboardings:
    post:
      tags:
        - Onboardings
      parameters:
        - in: header
          name: Content-Type
          schema:
            type: string
            default: application/json
          required: true
          description: Content type of the request body.
        - in: header
          name: User-Agent
          schema:
            type: string
          required: true
          description: The user agent string of the HTTP client.
        - in: header
          name: Accept
          schema:
            type: string
            default: application/json
          required: true
          description: Specifies media types that are acceptable for the response.
      summary: Create an Onboarding
      description: |-
        Create an onboarding allows a partner to create an Afterpay account for the merchant and dynamically auto-enable the merchant for all eligible Afterpay products based on agreed-on gating logic. See [here](https://afterpay.docs.buildwithfern.com/afterpay-partner-api/guides/technical-guides/onboarding) for more information about `businessType`.
      operationId: createOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingPostPut'
      responses:
        '200':
          description: Onboarding created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostOnboardingResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
              example:
                httpStatus: 400
                errors:
                  CheckOwnersNameForBusinessType: Owners first and last name required
        '401':
          description: 'Unauthorized, HMAC verification failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401Response'
        '409':
          description: 'Conflict, onboarding already exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/409Response'
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
      x-stoplight:
        id: e756tfetks7bm
    get:
      tags:
        - Onboardings
      description: Get an Onboarding by `merchantReference`.
      summary: Get an Onboarding by Merchant Reference
      operationId: getOnboardingByMerchantReference
      parameters:
        - in: query
          name: merchantReference
          required: true
          schema:
            type: string
          description: Unique ID for the merchant in the partner's internal systems to index to Afterpay's Merchant ID (MID).
          example: merchantId123
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
          description: Content type of the request body.
          example: application/json
        - in: header
          name: User-Agent
          required: true
          schema:
            type: string
          description: The user agent string of the HTTP client.
        - in: header
          name: Accept
          required: true
          schema:
            type: string
          description: Specifies media types that are acceptable for the response.
          example: application/json
      responses:
        '200':
          description: Onboarding details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding'
        '401':
          description: 'Unauthorized, HMAC verification failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401Response'
        '404':
          description: Not Found - The specified resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404Response'
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
      x-stoplight:
        id: sqvvwkzm5cp3r
  '/v1/onboardings/{onboardingId}':
    get:
      tags:
        - Onboardings
      summary: Get an Onboarding by Onboarding Id
      description: Allows a partner to retrieve onboarding details using the `onboardingId`.
      operationId: getOnboardingById
      parameters:
        - in: path
          name: onboardingId
          required: true
          schema:
            type: string
          description: The id that is returned during a successful Create an onboarding call.
          example: 123abcd-456efgh-1124bd
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            default: application/json
          description: Content type of the request body.
        - in: header
          name: User-Agent
          required: true
          schema:
            type: string
          description: The user agent string of the HTTP client.
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          description: Specifies media types that are acceptable for the response.
      responses:
        '200':
          description: Onboarding details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Onboarding'
        '401':
          description: 'Unauthorized, HMAC verification failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401Response'
        '404':
          description: Onboarding not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404Response'
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
      x-stoplight:
        id: bh0u4crl7q24u
    put:
      tags:
        - Onboardings
      summary: Update an Onboarding
      description: Allows a partner to update onboarding details using the onboardingId. For secondary rate updates please see the Rates page in the Capabilities API section.
      operationId: updateOnboarding
      parameters:
        - in: path
          name: onboardingId
          required: true
          schema:
            type: string
          description: The ID returned during a successful Create an onboarding call.
          example: 123abcd-456efgh-1124bd
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            default: application/json
          description: Content type of the request body.
        - in: header
          name: User-Agent
          required: true
          schema:
            type: string
          description: The user agent string of the HTTP client.
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          description: Specifies media types that are acceptable for the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingPostPut'
      responses:
        '200':
          description: Onboarding updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboardingId:
                    type: string
                    description: The ID that can be used to update merchant's configs and get an onboarding status.
                    example: 123abcd-456efgh-1124bd
                  timestamp:
                    type: string
                    description: Timestamp of the response.
                    example: '2024-02-21T10:21:36.949Z'
                  merchantReference:
                    type: string
                    description: Unique ID for the merchant in the partner's internal systems to index to Afterpay's Merchant ID (MID).
                    example: merchantId1234
                  parentMerchantReference:
                    type: string
                    description: Unique ID for the platform of the merchant in the partner's internal systems to index to merchantReference.
                    example: merchantPlatform
                  status:
                    type: string
                    description: Onboarding approval status.
                    example: APPROVED
        '400':
          description: Bad Request. If this error is thrown when attempting to apply a tier update, the error body will return the response body of a [400Response2](https://afterpay.docs.buildwithfern.com/afterpay-partner-api/guides/technical-guides/welcome/introduction) error instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/400Response'
        '401':
          description: 'Unauthorized, HMAC verification failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401Response'
        '404':
          description: Not Found - The specified resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404Response'
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
      x-stoplight:
        id: mo0se10ei50bi
  '/v1/onboardings/{onboardingId}/activations':
    get:
      tags:
        - Onboardings
      summary: Get Activations
      description: 'Returns the onboarding status, merchant credentials, configuration details.'
      operationId: getOnboardingStatus
      parameters:
        - in: path
          name: onboardingId
          required: true
          schema:
            type: string
          description: The ID that is returned during a successful Create an onboarding call.
          example: 123abcd-456efgh-1124bd
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            default: application/json
          description: Content type of the request body.
        - in: header
          name: User-Agent
          required: true
          schema:
            type: string
          description: The user agent string of the HTTP client.
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          description: Specifies media types that are acceptable for the response.
      responses:
        '200':
          description: 'Returns the onboarding status, merchant credentials, and configuration details.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Approval status of the onboarding.
                    example: APPROVED
                  credentials:
                    type: object
                    properties:
                      merchantId:
                        type: string
                        description: Afterpay's unique merchant ID (MID) for the merchant.
                        example: '123456789'
                      merchantSecret:
                        type: string
                        description: Secret key for the merchant ID.
                        example: 123abc456def789ghi101112jkl1314mnop1124bdayaya29djsncmxxjxkx9236xu38djx8dn3gbd3m45n21n
                  configuration:
                    type: object
                    properties:
                      minimumAmount:
                        type: object
                        properties:
                          amount:
                            type: string
                            description: Minimum transaction amount.
                            example: '1.00'
                          currency:
                            type: string
                            description: Currency for the minimum amount.
                            example: USD
                      maximumAmount:
                        type: object
                        properties:
                          amount:
                            type: string
                            description: Maximum transaction amount.
                            example: '4000.00'
                          currency:
                            type: string
                            description: Currency for the maximum amount.
                            example: USD
        '401':
          description: 'Unauthorized, HMAC verification failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401Response'
        '404':
          description: Not Found - The specified resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404Response'
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
      x-stoplight:
        id: j6likuzi6jvag
  '/v1/onboardings/{onboardingId}/capabilities':
    get:
      tags:
        - Capabilities
      summary: Get Capabilities
      description: Returns details for all Afterpay products and their configurations by onboardingId.
      operationId: getCapabilities
      parameters:
        - in: path
          name: onboardingId
          description: The ID returned during a successful Create an onboarding call.
          required: true
          schema:
            type: string
            example: 123abcd-456efgh-1124bd
        - in: header
          name: Content-Type
          description: Content type of the request.
          required: true
          schema:
            type: string
            default: application/json
        - in: header
          name: User-Agent
          description: The user agent string of the HTTP client.
          required: true
          schema:
            type: string
        - in: header
          name: Accept
          description: Specifies media types that are acceptable for the response.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Returns the capabilities configurations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboardingId:
                    type: string
                    description: The ID returned during a successful Create an onboarding call.
                    example: 123abcd-456efgh-1124bd
                  capabilities:
                    $ref: '#/components/schemas/Capabilities'
        '404':
          description: Not Found - The specified resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404Response'
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
      x-stoplight:
        id: kl3ghvkj16mnb
  '/v1/onboardings/{onboardingId}/capabilities/lending':
    put:
      tags:
        - Capabilities
      summary: Enable or Disable Pay Monthly (PM)
      description: |-
        Monthly Payments (MP) is Afterpay's interest-bearing product that allows consumers to split the purchase into 6 to 24 monthly payments. 

        All merchants are synchronously enrolled into Afterpay's PM product during the Create an onboarding call. This is based on merchant country, merchant category code (MCC), and agreed-on gating logic between Afterpay and the partner.

        Optionally, partners have an option to call this capabilities endpoint to disable PM or enable PM if it has been disabled before.  
      operationId: updatePmCapabilities
      parameters:
        - in: path
          name: onboardingId
          description: The ID returned during a successful Create an onboarding call.
          required: true
          schema:
            type: string
            example: 123abcd-456efgh-1124bd
        - in: header
          name: Content-Type
          description: Content type of the request body.
          required: true
          schema:
            type: string
            default: application/json
        - in: header
          name: User-Agent
          description: The user agent string of the HTTP client.
          required: true
          schema:
            type: string
        - in: header
          name: Accept
          description: Specifies media types that are acceptable for the response.
          required: true
          schema:
            type: string
            default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
                required:
                  - lending
                type: object
                properties:
                  lending:
                    type: array
                    items:
                      type: object
                      required:
                        - channel
                        - enabled
                      properties:
                          channel:
                            $ref: '#/components/schemas/Channel'
                          enabled:
                            type: boolean
                            description: Defines whether the capability is enabled for the above channel.
                            example: true
      responses:
        '200':
          description: Pay Monthly (PM) capability updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lending:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lending'
                  errors:
                    type: array
                    description: Shows any errors encountered during the capability enablement.
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
      x-stoplight:
        id: hb896mynm9nn8
  '/v1/onboardings/{onboardingId}/capabilities/cbt':
    put:
      tags:
        - Capabilities
      summary: Enable or Disable Cross Border Trade (CBT)
      description: Cross Border Trade (CBT) is Afterpay's FX product that enables merchants to transact internationally.
      operationId: configureCBT
      parameters:
        - in: path
          name: onboardingId
          description: The ID that is returned during a successful Create an onboarding call.
          required: true
          schema:
            type: string
            example: 123abcd-456efgh-1124bd
        - in: header
          name: Content-Type
          description: Content type of the request body.
          required: true
          schema:
            type: string
            default: application/json
        - in: header
          name: User-Agent
          description: The user agent string of the HTTP client.
          required: true
          schema:
            type: string
        - in: header
          name: Accept
          description: Specifies media types that are acceptable for the response.
          required: true
          schema:
            type: string
            default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channels
              properties:
                channels:
                  type: array
                  items:
                    type: object
                    required:
                      - channel
                      - enabled
                    properties:
                      channel:
                        $ref: '#/components/schemas/Channel'
                      enabled:
                        type: boolean
                        description: Defines whether the capability is enabled for the above channel.
                        example: true
                      currlocEnabled:
                        type: boolean
                        description: Shows whether the currency localization variant of CBT is enabled.
                        example: true
      responses:
        '200':
          description: CBT configuration updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    description: ID for the CBT config update request.
                    example: 86dg3d8-0b28-1627-378d-b9173ndhf87
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
      x-stoplight:
        id: xecshjirglxcu
  /v1/settlement/batches:
    get:
      tags:
        - Settlements
      summary: Get Settlement Batches
      description: 'Returns a list of settlement batches, sorted by creation date in ascending order.'
      operationId: getSettlementBatches
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
          description: Maximum number of rows to return. Defaults to 15 if not specified.
          example: 100
        - in: query
          name: last_known
          schema:
            type: string
          description: A settlement batch ID. Results will contain all settlement batches whose creation date is greater than that of the last_known ID.
          example: '785389121238'
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            default: application/json
          description: Content type of the request body.
        - in: header
          name: User-Agent
          required: true
          schema:
            type: string
          description: The user agent string of the HTTP client.
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          description: Specifies media types that are acceptable for the response.
      responses:
        '200':
          description: Successful response with a list of settlement batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSettlement'
        '401':
          description: 'Unauthorized, HMAC verification failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401Response'
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
      x-stoplight:
        id: f0nr5kwrajmk3
  '/v1/settlement/batches/date/{YYYY-MM-DD}':
    get:
      tags:
        - Settlements
      summary: Get Settlement Batches by Date
      description: 'Returns a list of settlement batches, sorted by creation date in ascending order.'
      operationId: getSettlementBatchesByDate
      parameters:
        - in: path
          required: true
          name: YYYY-MM-DD
          schema:
            type: string
          description: Date of the settlement files to retrieve.
          example: '2024-01-29'
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            default: application/json
          description: Content type of the request body.
        - in: header
          name: User-Agent
          required: true
          schema:
            type: string
          description: The user agent string of the HTTP client.
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          description: Specifies media types that are acceptable for the response.
      responses:
        '200':
          description: Successful response with a list of settlement batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchSettlement'
        '401':
          description: 'Unauthorized, HMAC verification failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401Response'
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
      x-stoplight:
        id: gzqix16wxvm06
  /v1/settlement/batch:
    get:
      tags:
        - Settlements
      summary: Get Settlement Batch Files
      description: Returns signed S3 urls to the settlement file and aggregation file for specified batch IDs.
      operationId: getSettlementBatchFiles
      parameters:
        - in: query
          name: ids
          required: true
          schema:
            type: string
          description: Comma separated ids of batches to fetch.
          example: 'id1,id2,id3'
        - in: header
          name: Content-Type
          description: Content type of the request.
          required: true
          schema:
            type: string
            default: application/json
        - in: header
          name: User-Agent
          description: The user agent string of the HTTP client.
          required: true
          schema:
            type: string
        - in: header
          name: Accept
          description: Specifies media types that are acceptable for the response.
          required: true
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Successful response with signed S3 URLs for the settlement and aggregation files.
          content:
            application/json:
              schema:
                type: object
                properties:
                  batches:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Settlement batch ID.
                          example: 2020-07-10Z_sud294dgzb
                        settlement_file:
                          type: string
                          description: Signed S3 URL to the settlement file.
                          example: 'https://s3.amazonaws.com/settlements/transaction.csv?token'
                        aggregation_file:
                          type: string
                          description: Signed S3 URL to the aggregation file.
                          example: 'https://s3.amazonaws.com/settlements/aggregated.csv?token'
                  meta_data:
                    type: object
                    properties:
                      computed_at:
                        type: string
                        description: Timestamp of the query computation.
                        example: '2024-02-21T19:25:44Z'
                      link_expiry:
                        type: string
                        description: Timestamp of the link expiration.
                        example: '2024-03-06T19:25:44Z'
        '401':
          description: 'Unauthorized, HMAC verification failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/401Response'
        '404':
          description: Not Found - The specified resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/404Response'
        '503':
          description: 'Service unavailable.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/503Response'
      x-stoplight:
        id: ak1jk5sshp9an
  '/v1/rates-contract/{contractId}/review':
    post:
      tags:
        - Rates
      summary: Approve Contract
      description: 'Partners can set up their unique, volume-based buy-rate contract that precisely enforces their commercial agreement with Afterpay. This prevents any mis-billings from day one and has with a full audit trail.'
      operationId: reviewContract
      parameters:
        - name: contractId
          in: path
          required: true
          description: ID of the contract to approve
          schema:
            type: string
            example: '123457838'
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            default: application/json
          description: Content type of the request body.
        - in: header
          name: User-Agent
          required: true
          schema:
            type: string
          description: The user agent string of the HTTP client.
        - in: header
          name: Accept
          required: true
          schema:
            type: string
            default: application/json
          description: Specifies media types that are acceptable for the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contractId:
                  type: string
                  example: '785389121238'
                  description: The unique ID for the contract between Afterpay and the partner.
                userDetails:
                  $ref: '#/components/schemas/User'
                comment:
                  type: string
                  description: Comment specific to the contract request.
                  example: Approved by X on date Y for reason Z.
                status:
                  type: string
                  description: The de facto approval field that determines whether the contract request by Afterpay is approved or rejected by the partner.
                  example: APPROVED
                  enum:
                    - APPROVED
                    - REJECTED
                countryCode:
                  type: string
                  description: 'Country code in the two-letter ISO 3166-1 alpha-2 standard format, defining the consumer market for which the rates apply.'
                  example: US
                buyRates:
                  $ref: '#/components/schemas/BuyRates'
              required:
                - contractId
                - comment
                - userDetails
                - status
                - countryCode
                - buyRates
      responses:
        '200':
          description: Contract reviewed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
