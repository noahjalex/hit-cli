description: Describes the schema for a (read-only) payment object
x-tags:
  - response-object
properties:
  id:
    type: string
    x-stoplight:
      id: 2c2vtl59zwcos
    description: 'The unique, permanent, Afterpay generated Order ID.'
  token:
    type: string
    x-stoplight:
      id: kq5mwixbb0z26
    example: 005.2fkv5o963b132z8ppa34srlh60987y87d55re237wsg9tr4q2
    description: The token obtained from the checkout call
  status:
    x-stoplight:
      id: z13r31iye03gy
    enum:
      - APPROVED
      - DECLINED
    description: represents the status of the order
  created:
    type: string
    x-stoplight:
      id: fwcvkc668avar
    description: The UTC timestamp of when the payment was completed.
  originalAmount:
    $ref: ./Money.yaml
    x-stoplight:
      id: 9nff59eoi1jqi
    description: Total amount charged to the customer for the order.
  openToCaptureAmount:
    $ref: ./Money.yaml
    x-stoplight:
      id: 87fj94gxq2e3q
    description: Remaining amount that can be captured. Will always be zero for Immediate Payment Flow orders.
  paymentState:
    x-stoplight:
      id: ixes0zhtclaji
    enum:
      - AUTH_APPROVED
      - AUTH_DECLINED
      - PARTIALLY_CAPTURED
      - CAPTURED
      - CAPTURE_DECLINED
      - VOIDED
    description: is the current state for capturing payments
    example: AUTH_APPROVED
    readOnly: true
  merchantReference:
    type: string
    x-stoplight:
      id: ladn3xzmlhg5m
    description: is the merchant's order id/reference that the payment corresponds to.
    example: merchant-order-123
  refunds:
    x-stoplight:
      id: r4g8o6nwt0avu
    type: array
    description: 'An array of refunds. Note: in response to a Capture Full Payment call, this array will always be empty, since refunds cannot occur until payment is captured.'
    items:
      $ref: ./Refund.yaml
      x-stoplight:
        id: xjhnai83g292n
  orderDetails:
    $ref: ./Order-Details.yaml
    x-stoplight:
      id: 2dk91z5k68m9k
    description: The details of the order bound to the payment.
  events:
    x-stoplight:
      id: 6o9xgf1fsfcol
    type: array
    description: One or more payment events that have occurred against the order.
    items:
      $ref: ./Payment-Event.yaml
      x-stoplight:
        id: vtw16izhadpug
  agreements:
    type: array
    description: List of billing agreements created if any (field omitted if empty)
    items:
      $ref: ./BillingAgreementResponse.yaml
