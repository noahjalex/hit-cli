title: GrantApprovalRequest
type: object
required:
  - grants
  - merchant
properties:
  grants:
    type: array
    description: Grant type for approval (only single grant is supported)
    minItems: 1
    maxItems: 1
    items:
      $ref: ./GrantApprovalType.yaml
  merchant:
    type: object
    properties:
      redirectConfirmUrl:
        type: string
        example: 'https://example.com/approval/confirm'
      redirectCancelUrl:
        type: string
        example: 'https://example.com/approval/cancel'
      popupOriginUrl:
        type: string
        description: This property is optional when a `redirectConfirmURL` is provided.
        example: 'https://merchant.com/cart'
      name:
        type: string
        description: 'The merchant name displayed in the Afterpay approval flow.'
    required:
      - redirectConfirmUrl
      - redirectCancelUrl
  merchantReference:
    type: string
    description: Merchant's unique reference for this grant
    maxLength: 128
    example: "ba-ref-20240304-001"
  consumer:
    $ref: ./Consumer.yaml
    description: Consumer details for the grant
  