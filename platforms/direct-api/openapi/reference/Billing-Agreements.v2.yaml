openapi: 3.1.0
x-stoplight:
  id: 13b11ac94e2be
info:
  title: Online API
  version: v2
servers:
  - url: 'https://global-api-sandbox.afterpay.com'
    description: Sandbox
  - url: 'https://global-api.afterpay.com'
    description: Production
components:
  securitySchemes:
    sec0:
      type: http
      scheme: basic
security:
  - sec0: []
paths:
  /v2/billing-agreements:
    post:
      summary: Create Billing Agreement
      description: |
        Creates a new billing agreement from an order token.

        *Deprecated. For new integrations, see [Grants](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/api-reference/reference/grants/start-grant-approval).*
      operationId: create-billing-agreement
      parameters:
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: 'MyAfterpayModule/1.0.0 (E-Commerce Platform Name/1.0.0; PHP/7.0.0; Merchant/60032000) https://merchant.example.com'
          description: 'View our [User Agent Header](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header) page for formatting details.'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../models/CreateAgreementRequest.yaml
        description: The request containing the details needed to create a billing agreement
      responses:
        '200':
          description: Billing agreement created successfully
          content:
            application/json:
              schema:
                $ref: ../models/BillingAgreementResponse.yaml
        '403':
          description: |
            | errorCode | Description |
            | --- | --- |
            | billing_agreement_not_authorised | Recurring payments are not enabled for this merchant. |
            | headless_billing_agreement_not_authorised | Headless flow is not enabled for this merchant. |
        '412':
          description: |
            | errorCode | Description |
            | --- | --- |
            | consumer_ineligible | Consumer not eligible |
        '415':
          description: Unsupported Media Type - Content-Type header is missing or invalid
      x-stoplight:
        id: etjimapf51ulr
  /v2/billing-agreements/alias:
    post:
      summary: Create Billing Agreement Alias
      description: |-
        Creates an alias for an existing billing agreement to help load payment schedule widget.

        *Deprecated. For new integrations, see [Grants](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/api-reference/reference/grants/start-grant-approval).*
      operationId: alias-billing-agreement
      parameters:
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: 'MyAfterpayModule/1.0.0 (E-Commerce Platform Name/1.0.0; PHP/7.0.0; Merchant/60032000) https://merchant.example.com'
          description: 'View our [User Agent Header](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header) page for formatting details.'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../models/BillingAgreementAliasRequest.yaml
        description: The request containing the billing agreement token and optional duration
      responses:
        '200':
          description: Alias created successfully
          content:
            application/json:
              schema:
                $ref: ../models/BillingAgreementAliasResponse.yaml
        '403':
          description: |
            | errorCode | Description |
            | --- | --- |
            | billing_agreement_not_authorised | Recurring payments are not enabled for this merchant. |
        '415':
          description: Unsupported Media Type - Content-Type header is missing or invalid
      x-stoplight:
        id: 88pkdp1ckyjw3
  /v2/billing-agreements/approvals:
    post:
      summary: Start Billing Agreement Approval Process
      description: |-
        Initiates the approval process for a new billing agreement.

        *Deprecated. For new integrations, see [Grants](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/api-reference/reference/grants/start-grant-approval).*
      operationId: start-billing-agreement-approval
      parameters:
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: 'MyAfterpayModule/1.0.0 (E-Commerce Platform Name/1.0.0; PHP/7.0.0; Merchant/60032000) https://merchant.example.com'
          description: 'View our [User Agent Header](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header) page for formatting details.'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../models/BillingAgreementApprovalRequest.yaml
        description: The billing agreement approval request details
      responses:
        '200':
          description: The consumer approved the billing agreement
          content:
            application/json:
              schema:
                $ref: ../models/BillingAgreementApprovalResponse.yaml
        '401':
          description: |
            Authentication failed or insufficient permissions.

            | errorCode | Description |
            | --- | --- |
            | unauthorized | The API credentials are invalid or missing. |
            | insufficient_permissions | The merchant lacks the required 'merchant_api_v2/initiate' permission. |
        '403':
          description: |
            | errorCode | Description |
            | --- | --- |
            | billing_agreement_not_authorised | Recurring payments are not enabled for this merchant. |
        '415':
          description: Unsupported Media Type - Content-Type header is missing or invalid
        '422':
          description: |
            | errorCode | Description |
            | --- | --- |
            | invalid_object | One or more required fields in the request body were missing or invalid. |
        default:
          description: Unexpected error
      x-stoplight:
        id: sumagl8wd8ois
  /v2/billing-agreements/cancel:
    put:
      summary: Cancel Billing Agreement (Alternative)
      description: |-
        Alternative endpoint to cancel a billing agreement using a request body instead of path parameter.
        Functionally equivalent to DELETE /v2/billing-agreements/{token}.

        *Deprecated. For new integrations, see [Grants](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/api-reference/reference/grants/start-grant-approval).*
      operationId: cancel-billing-agreement-alt
      parameters:
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: 'MyAfterpayModule/1.0.0 (E-Commerce Platform Name/1.0.0; PHP/7.0.0; Merchant/60032000) https://merchant.example.com'
          description: 'View our [User Agent Header](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header) page for formatting details.'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../models/CancelBillingAgreementRequest.yaml
        description: The request containing the billing agreement token to cancel
      responses:
        '200':
          description: Billing agreement cancelled successfully
          content:
            application/json:
              schema:
                $ref: ../models/BillingAgreementResponse.yaml
        '403':
          description: |
            | errorCode | Description |
            | --- | --- |
            | billing_agreement_not_authorised | Recurring payments are not enabled for this merchant. |
        '404':
          description: |
            | errorCode | Description |
            | --- | --- |
            | billing_agreement_not_found | The specified billing agreement token was not found. |
      x-stoplight:
        id: q5fbys10sc03l
  /v2/billing-agreements/offers:
    post:
      summary: Retrieve Billing Agreement Offers
      description: |-
        Retrieves available offers for billing agreements based on amount and frequency.

        *Deprecated. For new integrations, see [Grants](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/api-reference/reference/grants/start-grant-approval).*
      operationId: retrieve-billing-agreement-offers
      parameters:
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: 'MyAfterpayModule/1.0.0 (E-Commerce Platform Name/1.0.0; PHP/7.0.0; Merchant/60032000) https://merchant.example.com'
          description: 'View our [User Agent Header](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header) page for formatting details.'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../models/OffersRequest.yaml
        description: The request containing the amount and billing agreement token to check offers for
      responses:
        '200':
          description: Offers retrieved successfully
          content:
            application/json:
              schema:
                $ref: ../models/OffersResponse.yaml
        '401':
          description: |
            Authentication failed or insufficient permissions.

            | errorCode | Description |
            | --- | --- |
            | unauthorized | The API credentials are invalid or missing. |
        '403':
          description: |
            | errorCode | Description |
            | --- | --- |
            | billing_agreement_not_authorised | Recurring payments are not enabled for this merchant. |
        '422':
          description: |
            | errorCode | Description |
            | --- | --- |
            | invalid_object | One or more required fields in the request body were missing or invalid. |
      x-stoplight:
        id: xad26rd4hslmg
  /v2/billing-agreements/retrieve:
    post:
      summary: Retrieve Billing Agreement
      description: |-
        Alternative endpoint to retrieve billing agreement details using a request body instead of path parameter.
        Functionally equivalent to GET /v2/billing-agreements/{token}.

        *Deprecated. For new integrations, see [Grants](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/api-reference/reference/grants/start-grant-approval).*
      operationId: retrieve-billing-agreement
      requestBody:
        required: true
        content:
          application/json:
            schema:
