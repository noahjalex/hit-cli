  /v2/recurring-payments:
    post:
      summary: Capture Full Recurring Payment
      description: |-
        Creates and immediately captures a recurring payment using a billing agreement token.
        This endpoint combines authorization and capture into a single step.

        *Deprecated. For new integrations, see [Grants](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/api-reference/reference/grants/start-grant-approval).*
      operationId: capture-full-recurring-payment
      parameters:
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: 'MyAfterpayModule/1.0.0 (E-Commerce Platform Name/1.0.0; PHP/7.0.0; Merchant/60032000) https://merchant.example.com'
          description: 'View our [User Agent Header](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header) page for formatting details.'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../models/RecurringPaymentRequest.yaml
        description: The request containing the payment details to process
      responses:
        '201':
          description: |
            | Status | Description |
            | ----- | ----- |
            | `APPROVED` | If payment is approved by Afterpay, returns a Payment object in response, with a status of "APPROVED". |
            | `DECLINED` | If payment is declined by Afterpay, for example, if expired payment method, returns a Payment object in response, with a status of "DECLINED". Please advise the consumer to contact the Afterpay Customer Service team for more information. |
          content:
            application/json:
              schema:
                $ref: ../models/Payment.yaml
        '402':
          description: |
            If payment is declined by Afterpay, for example, if invalid card details were entered, returns a Payment object in response, with a `status` of "DECLINED" and a `paymentState` of "AUTH_DECLINED". Please advise the consumer to contact the Afterpay Customer Service team for more information.

            As well, the following errorCodes are possible:
            | errorCode | Description |
            | --- | --- |
            | invalid_token | The checkout token is invalid, expired, or does not exist.
        '415':
          description: Unsupported Media Type
        '422':
          description: |
            | errorCode | Description |
            | --- | --- |
            | invalid_object             | One or more required fields were missing or invalid.                     |
            | unsupported_payment_type   | The amount is outside of the merchant's payment limits, as returned by Get Configuration. |
            | unsupported_currency       | The amount is outside of the merchant's payment limits, as returned by Get Configuration. |
        default:
          description: See additional PUT/POST Errors applicable to all POST endpoints.
      x-stoplight:
        id: ikf59hjhtr2id
  /v2/recurring-payments/auth:
    post:
      summary: Authorize Recurring Payment
      description: |-
        Authorizes a recurring payment using a billing agreement token.
        This endpoint performs authorization only, requiring a separate capture step.

        *Deprecated. For new integrations, see [Grants](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/api-reference/reference/grants/start-grant-approval).*
      operationId: auth
      parameters:
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: 'MyAfterpayModule/1.0.0 (E-Commerce Platform Name/1.0.0; PHP/7.0.0; Merchant/60032000) https://merchant.example.com'
          description: 'View our [User Agent Header](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header) page for formatting details.'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../models/RecurringPaymentRequest.yaml
        description: The request containing the payment details to authorize
      responses:
        '201':
          description: 'If the payment is approved by Afterpay, a Payment object is returned with a `status` of **APPROVED** and a `paymentState` of **AUTH_APPROVED**.'
          content:
            application/json:
              schema:
                $ref: ../models/PaymentAuth.yaml
              examples: {}
        '402':
          description: |
            If payment is declined by Afterpay, for example, if invalid card details were entered, returns a Payment object in response, with a `status` of "DECLINED" and a `paymentState` of "AUTH_DECLINED". Please advise the consumer to contact the Afterpay Customer Service team for more information.

            As well, the following errorCodes are possible:
            | errorCode | Description |
            | --- | --- |
            | invalid_token | The checkout token is invalid, expired, or does not exist.
        '412':
          description: |
            | errorCode | Description |
            | --- | --- |
            |npuf_eligibility_mismatch|Npuf eligibility mismatch|
        '415':
          description: Unsupported Media Type
        '422':
          description: |
            | errorCode | Description |
            | --- | --- |
            | invalid_object             | One or more required fields were missing or invalid.                     |
            | unsupported_payment_type   | The amount is outside of the merchant's payment limits, as returned by Get Configuration. |
            | unsupported_currency       | The amount is outside of the merchant's payment limits, as returned by Get Configuration. |
        default:
          description: see additional PUT/POST errors applicable to all POST endpoints.
      x-stoplight:
        id: 1dioxsqdozyrn
webhooks:
  AgreementStatusUpdated:
    post:
      summary: Billing agreement status updated
      description: Webhook notification sent when a billing agreement's status changes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - agreementToken
                - status
                - reasons
                - dateTime
              properties:
                agreementToken:
                  type: string
                  description: Token identifying the billing agreement
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - INACTIVE
                    - TERMINATED
                  description: Current status of the agreement
                reasons:
                  type: array
                  description: 'List of reasons for the status update such as {PAYMENT_METHOD_EXPIRED, PENDING_RENEWAL, ACCOUNT_DEACTIVATED, USER_CANCELLED}'
                  items:
                    type: string
                message:
                  type: string
                  description: Optional message providing additional context
                  nullable: true
                dateTime:
                  type: string
                  description: Timestamp of the status update
                  format: date-time
      responses:
        '200':
          description: Acknowledgment that the webhook was received
