  '/v2/payments/{orderId}/refund':
    post:
      summary: Create Refund
      description: |
        This endpoint performs a full or partial refund. The refund operation is idempotent if a unique `requestId` and `merchantReference` are provided.

        If using the [Deferred Payment Flow](../docs/API-DEVELOPMENT/2b.-Auth-and-Capture.md), please be aware that only captured funds can be refunded. Don't create refunds after 120 days from the date of purchase.

        **Connection Timeouts**
        | Timeout | Time (Seconds) |
        |---------|----------------|
        | Open    | 10             |
        | Read    | 70             |
      operationId: create-refund
      parameters:
        - name: orderId
          in: path
          description: The unique Afterpay Order ID to apply the refund to.
          schema:
            type: string
          required: true
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
          description: 'View our <a href="https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header" target = "_blank">User Agent</a> page for formatting details'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../models/CreateRefund.yaml
      responses:
        '201':
          description: |
            Returns a Refund object in response. All request parameters will be echoed in the response. In addition, the response includes the following:
            | Attribute | Type | Description |
            | --- | --- | --- |
            | `refundId` | string | The unique, permanent, Afterpay-generated Refund ID. |
            | `refundedAt` | string | The UTC timestamp of when the refund was completed, in [ISO 8601](https://www.iso.org/iso-8601-date-and-time-format.html) format. |
          content:
            application/json:
              schema:
                $ref: ../models/Refund.yaml
              examples: {}
        '412':
          description: 'The `orderId` is invalid, does not exist, or is not eligible for a refund. For example, the order was declined. Error code `precondition_failed`.'
        '422':
          description: |
            | errorCode | Description |
            | --- | --- |
            | invalid_object | The `refundMerchantReference` exceeded 128 characters. |
            | invalid_amount | The `amount` requested exceeded the amount available. |
            | invalid_object | The currency of the refund does not match the currency of the order (and the Merchant account). |
            | refund_timelimit_exceeded | The refund exceeds the time limit of 120 days |
        default:
          description: See additional PUT/POST Errors applicable to all POST endpoints.
