  '/v2/payments/token:{token}/reversal':
    post:
      summary: Reverse Payment By Token
      description: |
        This endpoint performs a reversal of the checkout that is used to initiate the Afterpay payment process. This will cancel the order asynchronously as soon as it is created without the need of an additional call to the void endpoint. In order for a payment to be eligible, the order must be in an Auth-Approved or Captured state and must be issued within 10 minutes of the order being created.

        **Connection Timeouts**
        | Timeout | Time (Seconds) |
        |---------|----------------|
        | Open    | 10             |
        | Read    | 70             |
      operationId: reverse-payment-by-token
      parameters:
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
          description: 'View our <a href="https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header" target = "_blank">User Agent</a> page for formatting details'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
        - name: token
          in: path
          description: The token of the checkout to be reversed (voided).
          schema:
            type: string
          required: true
      responses:
        '204':
          description: The Reversal endpoint indicates a successful response with a 204 status code response. Returns no content in the response.
        '402':
          description: Invalid Token. Error code `invalid_token`.
        '412':
          description: |
            | errorCode | Description |
            | --- | --- |
            | precondition_failed | Payment reversal previously processed |
            | precondition_failed | Payment not eligible for a reversal |
            | precondition_failed | Order outside reversal window |
            | precondition_failed | Order in pending reversal, no captures/auth accepted |
        default:
          description: see additional PUT/POST errors applicable to all POST endpoints.
