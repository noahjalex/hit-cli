openapi: 3.1.0
x-stoplight:
  id: 9fd8ede82eabd
info:
  title: Online API
  version: v2
servers:
  - url: 'https://global-api-sandbox.afterpay.com'
    description: Sandbox
  - url: 'https://global-api.afterpay.com'
    description: Production
components:
  securitySchemes:
    sec0:
      type: http
      scheme: basic
  schemas:
    AuthorizePayment:
      title: AuthorizePayment
      x-stoplight:
        id: vcltbn679m2dr
      type: object
      examples: []
      required:
        - token
      properties:
        requestid:
          x-stoplight:
            id: 7gpl6ebyjs6xg
          type: string
          description: 'A unique request ID, required for idempotent retries. It is recommended that the merchant generate a UUID for each unique request.'
          format: uuid
        token:
          type: string
          x-stoplight:
            id: 0u7p3map4vm84
          example: 005.2fkv5o963b132z8ppa34srlh60987y87d55re237wsg9tr4q2
        merchantReference:
          type: string
          x-stoplight:
            id: r7zvjiwxfpu75
          description: |-
            The reference/ order id that this payment corresponds to in the merchant's system.

            Note: Providing a new value will update any value previously set in the Create Checkout request.
          example: merchant-order-123
        amount:
          $ref: ../models/Money.yaml
          x-stoplight:
            id: xck9w7dhyyw2i
          description: '**Required for express checkout only.** Amount to be checked against the value in the create checkout request. If the amounts do not match, then the request is rejected and an error specific to this scenario is returned. '
        isCheckoutAdjusted:
          type: boolean
          x-stoplight:
            id: p8jd6t2dmrs01
          description: '**Express checkout only.** The isCheckoutAdjusted field can be used to allow the order amount to be changed after the checkout flow.'
        paymentScheduleChecksum:
          type: string
          x-stoplight:
            id: 365yxonge52w6
          description: '**Express checkout only.** A unique value representing the payment schedule that must be provided when there has been changes since the initial order creation (retrieved from checkout widget).'
        items:
          type: array
          x-stoplight:
            id: bjoeak4624dtz
          description: '**Express checkout only.** An array of order items that have been updated to be provided if it has changed since the initial order creation.'
          items: {}
        shipping:
          $ref: ../models/Contact.yaml
          x-stoplight:
            id: 5p4n8a930skpd
          description: '**Express checkout only.** The shipping address if it has changed since the initial order creation. '
        enrichments:
          $ref: '#/components/schemas/Enrichments'
    CapturePayment:
      title: CapturePayment
      x-stoplight:
        id: 5g5m2notxyuid
      type: object
      properties:
        requestId:
          type: string
          format: uuid
          description: 'A unique request ID, required for idempotent retries.'
        merchantReference:
          type: string
          description: |-
            The reference/ order id that this payment corresponds to in the merchant's system. 

            Note: Providing a new value will update any value previously set in the Create Checkout request.
          example: merchant-order-123
        amount:
          $ref: ../models/Money.yaml
        paymentEventMerchantReference:
          type: string
          x-stoplight:
            id: wcxlaey7hdchf
          description: |
            A unique reference for the individual payment capture event. If provided, the value will appear in the daily settlement file as "Payment Event ID"
          maxLength: 128
          example: payment-ref-123
    Enrichments:
      title: Enrichments
      x-stoplight:
        id: 75y95phn46dx7
      type: object
      description: Additional enrichment data for the payment.
      properties:
        initiation:
          type: object
          x-stoplight:
            id: hvipu7urb1ahx
          description: Information about how the payment was initiated.
          properties:
            actor:
              x-stoplight:
                id: rv245clbzcs3g
              enum:
                - MERCHANT
                - CUSTOMER
              description: The party that initiated the payment.
  requestBodies:
    Auth:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthorizePayment'
            x-examples:
              Example 1:
                requestid: d22f5305-05f3-48a0-9131-a4e6e5f58b9a
                token: string
                merchantReference: order-12345
                amount:
                  amount: '100.00'
                  currency: AUD
          examples:
            Standard checkout:
              value:
                requestid: d22f5305-05f3-48a0-9131-a4e6e5f58b9a
                token: 005.2fkv5o963b132z8ppa34srlh60987y87d55re237wsg9tr4q2
                merchantReference: merchant-order-123
            Express checkout:
              value:
                requestid: d22f5305-05f3-48a0-9131-a4e6e5f58b9a
                token: 005.2fkv5o963b132z8ppa34srlh60987y87d55re237wsg9tr4q2
                merchantReference: merchant-order-123
                amount:
                  amount: '100.00'
                  currency: AUD
                isCheckoutAdjusted: true
                paymentScheduleChecksum: string
                items:
                  - null
                shipping:
                  name: Joe Consumer
                  line1: Level 5
                  line2: 390 Collins Street
                  area1: Melbourne
                  region: VIC
                  postcode: '3000'
                  countryCode: AU
                  phoneNumber: 0400 000 000
                enrichments:
                  initiation:
                    actor: MERCHANT
security:
  - sec0: []
paths:
  /v2/payments:
    get:
      summary: List Payments
      description: |
        This endpoint retrieves a collection of payments along with their order details.

        **Connection Timeouts**
        | Timeout | Time (Seconds) |
        |---------|----------------|
        | Open    | 10             |
        | Read    | 20             |
      operationId: list-payments
      parameters:
        - name: toCreatedDate
          in: query
          description: 'An inclusive end date and time to search, in [ISO 8601](http://www.iso.org/iso/home/standards/iso8601.htm) format.'
          schema:
            type: string
            default: '2020-12-30'
        - name: fromCreatedDate
          in: query
          description: 'An inclusive start date and time to search, in [ISO 8601](http://www.iso.org/iso/home/standards/iso8601.htm) format.'
          schema:
            type: string
            default: '2020-01-01'
        - name: tokens
          in: query
          description: One or more order tokens to search for.
          schema:
            type: array
            items:
              type: string
            default:
              - '10'
        - name: includeNextLink
          in: query
          description: Will return a modified pagination object which includes a url to return the next page. The default value is false.
          schema:
            type: boolean
            default: false
        - name: ids
          in: query
          description: One or more Afterpay Order IDs to search for.
          schema:
            type: array
            items:
              type: string
            default:
              - '0'
        - name: merchantReferences
          in: query
          description: One or more Merchant Reference IDs to search for.
          schema:
            type: array
            items:
              type: string
            default:
              - '0'
        - name: statuses
          in: query
          description: One or more Afterpay Order Statuses to search for. Possible values include "APPROVED" and "DECLINED".
          schema:
            type: array
            items:
              type: string
            default:
              - Approved
        - name: orderBy
          in: query
          description: 'A field to order results by. If provided, must be one of "createdAt", "id", "totalAmount", "merchantReference" or "email".'
          schema:
            type: string
            default: createdAt
        - name: ascending
          in: query
          description: '`true` to order results in ascending order, or `false` for descending order.'
          schema:
            type: boolean
            default: false
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
          description: 'View our <a href="https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header" target = "_blank">User Agent</a> page for formatting details'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: 'Returns the matching Payment objects, enclosed in a Pagination object.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalResults:
                    type: integer
                    description: Total number of results
                    example: 445
                  offset:
                    type: integer
                    description: The offer of the pagination
                    example: 3
                  limit:
                    type: integer
                    description: The number of payments to include in the results
                    example: 1
                  results:
                    type: array
                    items:
                      $ref: ../models/Payment.yaml
        '422':
          description: 'An invalid query param was provided. For example, a value for `limit` was provided, but was less than 1 or more than 250. Error code `error`.'
        '500':
          description: 'This is usually caused by sending a `fromCreatedDate` or `toCreatedDate` in an invalid format. Please ensure the dash and colon characters are included, and any plus characters are URL-encoded. Also, for the array parameters (`ids`, `tokens`, `merchantReferences` and `statuses`), do not use comma-separated values or square brackets. Instead, include each parameter multiple times, as needed.'
        default:
          description: See GET errors.
      deprecated: false
      x-stoplight:
        id: qcul2gbmqq9ph
  /v2/payments/auth:
    post:
      summary: Auth
      description: |
        This endpoint requests a payment auth, which determines the order approval status. If approved, the auth has an expiration date and time, which is returned in the events list for the "AUTH_APPROVED" payment event. Authorization expires after 13 days.

        This operation is idempotent based on the `requestId` (if provided), which allows for the safe retry of multiple requests, guaranteeing the payment operation is only performed once.

        The consumer's payment plan will begin at the time of auth approval.

        **Note:** Authorization expires after 13 days and then the transaction is automatically voided. Voided transactions are frozen and cannot be reopened or changed in any way. In this case your only option is to use the v2/checkouts endpoint to create a new order.

        **Connection Timeouts**
        | Timeout | Time (Seconds) |
        |---------|----------------|
        | Open    | 10             |
        | Read    | 70             |
      operationId: auth
      parameters:
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
          description: 'View our <a href="https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header" target = "_blank">User Agent</a> page for formatting details'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        $ref: '#/components/requestBodies/Auth'
      responses:
        '201':
          description: 'If the payment is approved by Afterpay, a Payment object is returned with a `status` of **APPROVED** and a `paymentState` of **AUTH_APPROVED**.'
          content:
            application/json:
              schema:
                $ref: ../models/PaymentAuth.yaml
              examples: {}
        '402':
          description: |
            If payment is declined by Afterpay, for example, if invalid card details were entered, returns a Payment object in response, with a `status` of "DECLINED" and a `paymentState` of "AUTH_DECLINED". Please advise the consumer to contact the Afterpay Customer Service team for more information.

            As well, the following errorCodes are possible:
            | errorCode | Description |
            | --- | --- |
            | invalid_token | The checkout token is invalid, expired, or does not exist.
        '412':
          description: The Consumer has not confirmed their payment for the order associated with this token. Error code `invalid_order_transaction_status`.
        '422':
          description: The checkout token was missing or empty. Error code `invalid_object`.
        default:
          description: see additional PUT/POST errors applicable to all POST endpoints.
      deprecated: false
      x-stoplight:
        id: 9h0ia4mcxnl33
  /v2/payments/capture:
    post:
      summary: Capture Full Payment
      description: |
        This endpoint performs a payment capture for the full value of the payment plan.

        This operation is idempotent based on the token, which allows for the safe retry of requests, guaranteeing the payment operation is only performed once.

        Since the idempotency of this endpoint is based on the token, the inclusion of a `requestId` is not required.

        **Connection Timeouts**
        | Timeout | Time (Seconds) |
        |---------|----------------|
        | Open    | 10             |
        | Read    | 70             |
      operationId: capture-full-payment
      parameters:
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: 'MyAfterpayModule/1.0.0 (E-Commerce Platform Name/1.0.0; PHP/7.0.0; Merchant/60032000) https://merchant.example.com'
          description: 'View our [User Agent Header](https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header) page for formatting details.'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: The token returned in the Create Checkout request.
                merchantReference:
                  type: string
                  description: The merchant’s order id/reference that this payment corresponds to. This will update any value previously provided in the Create Checkout request.
                amount:
                  $ref: ../models/Money.yaml
                  x-stoplight:
                    id: 40dejknwcq66u
                  description: '**Required for express checkout only.** Amount to be checked against the value in the create checkout request. If the amounts do not match, then the request is rejected and an error specific to this scenario is returned. '
                isCheckoutAdjusted:
                  type: boolean
                  x-stoplight:
                    id: bna9psrb8gaa9
                  description: '**Express checkout only.** The isCheckoutAdjusted field can be used to allow the order amount to be changed after the checkout flow. '
                paymentScheduleChecksum:
                  type: string
                  x-stoplight:
                    id: w8v4tju4pswwc
                  description: '**Express checkout only.** A unique value representing the payment schedule that must be provided when there have been changes since the initial order creation (retrieved from checkout widget). '
                items:
                  $ref: ../models/Item.yaml
                  x-stoplight:
                    id: mfg6eceoc0szw
                  description: '**Express checkout only.** An array of order items that have been updated. Provide if it has changed since the initial order creation. '
                shipping:
                  $ref: ../models/Contact.yaml
                  x-stoplight:
                    id: m64pvazmb16rf
                  description: '**Express checkout only.** The shipping address if it has changed since the initial order creation.'
                enrichments:
                  $ref: '#/components/schemas/Enrichments'
            examples:
              Standard checkout:
                value:
                  token: '{{afterpay_checkout_token}}'
                  merchantReference: '{{merchant_order_number}}'
              Express checkout:
                value:
                  token: string
                  merchantReference: string
                  amount:
                    amount: '100.00'
                    currency: AUD
                  isCheckoutAdjusted: true
                  paymentScheduleChecksum: string
                  items:
                    name: Blue Carabiner
                    sku: '12341234'
                    quantity: 1
                    pageUrl: 'https://merchant.example.com/carabiner-354193.html'
                    imageUrl: 'https://merchant.example.com/carabiner-7378-391453-1.jpg'
                    price:
                      amount: '40.00'
                      currency: AUD
                    categories:
                      - - Sporting Goods
                        - Climbing Equipment
                        - Climbing
                        - Climbing Carabiners
                      - - Sale
                        - Climbing
                    estimatedShipmentDate: '2023-08-01'
                  shipping:
                    name: Joe Consumer
                    line1: Level 5
                    line2: 390 Collins Street
                    area1: Melbourne
                    region: VIC
                    postcode: '3000'
                    countryCode: AU
                    phoneNumber: 0400 000 000
                  enrichments:
                    initiation:
                      actor: MERCHANT
      responses:
        '201':
          description: |
            | Status | Description |
            | ----- | ----- |
            | `APPROVED` | If payment is approved by Afterpay, returns a Payment object in response, with a status of "APPROVED". |
            | `DECLINED` | If payment is declined by Afterpay, for example, if invalid card details were entered, returns a Payment object in response, with a status of "DECLINED". Please advise the consumer to contact the Afterpay Customer Service team for more information. |
          content:
            application/json:
              schema:
                $ref: ../models/Payment.yaml
        '402':
          description: 'The checkout token is invalid, expired, or does not exist. Error code `invalid_token`.'
        '412':
          description: The Consumer has not confirmed their payment for the order associated with this token. Error code `invalid_order_transaction_status`.
        '422':
          description: The checkout token was missing or empty. Error code `invalid_object`.
        default:
          description: See additional PUT/POST Errors applicable to all POST endpoints.
          content:
            application/json:
              schema:
                $ref: ../models/Payment.yaml
      deprecated: false
  '/v2/payments/{orderId}':
    get:
      summary: Get Payment By Order ID
      description: |
        This endpoint retrieves an individual payment along with its order details.

        **Connection Timeouts**
        | Timeout | Time (Seconds) |
        |---------|----------------|
        | Open    | 10             |
        | Read    | 20             |
      operationId: get-payment-by-order-id
      parameters:
        - name: orderId
          in: path
          description: 'The unique ID of the Afterpay Order, for which a Payment event has been completed.'
          schema:
            type: string
          required: true
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
          description: 'View our <a href="https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header" target = "_blank">User Agent</a> page for formatting details'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      responses:
        '200':
          description: Returns a Payment object in response.
          content:
            application/json:
              schema:
                $ref: ../models/Payment.yaml
        '404':
          description: No Afterpay Order was found matching the `orderId` provided. Error code `not_found`.
        default:
          description: See GET errors errors.
      deprecated: false
      x-stoplight:
        id: jtqs9hr6uilwy
    put:
      summary: Update Payment by Order ID
      description: This endpoint is to create merchant side order ID's following the Afterpay order ID creation. The endpoint should be called immediately after the Afterpay order is created.
      operationId: update-payment-by-order-id
      parameters:
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: 'MyAfterpayModule/1.0.0 (E-Commerce Platform Name/1.0.0; PHP/7.0.0; Merchant/60032000) https://merchant.example.com'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
        - name: Content-Type
          in: header
          schema:
            type: string
            default: application/json
        - name: orderId
          in: path
          description: The Order ID to update
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - merchantReference
              properties:
                merchantReference:
                  type: string
                  description: The merchant’s new order id to replace with
                  default: new_merchant_order_id_1234
      responses:
        '201':
          description: Returns object containing the following attributes.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                    description: The unique Afterpay (merchant payment) payment Id
                  token:
                    type: string
                    description: Checkout token to be used to complete consumer checkout and payment.
                  status:
                    type: string
                    description: \"APPROVED" (update is only valid for successful orders)
                  created:
                    type: string (ISO-8601)
                    description: The payment creation time (ISO 8601 UTC/Zulu time).
                  originalAmount:
                    type: object
                    description: Total amount for the order. See Money.
                  openToCaptureAmount:
                    type: object
                    description: Total amount that can be captured for order. See Money.
                  paymentState:
                    type: string
                    description: 'Available states: "AUTH_APPROVED", "CAPTURED", "VOIDED", "EXPIRED", "AUTH_DECLINED", "PARTIALLY_CAPTURED", "CAPTURE_DECLINED""'
                  merchantReference:
                    type: string | The merchant’s order id/reference that this payment corresponds to. |
                  refunds:
                    type: object
                    description: The refund details for merchant's order. See Refund.
                  orderDetails:
                    type: object
                    description: The order bound to the payment. See Order Details.
                  events:
                    type: object
                    description: Event list for for merchant's order. See Events.
        '404':
          description: The Afterpay payment Id to update was not found. Error code `not_found`.
        default:
          description: See additional PUT/POST Errors applicable to all POST endpoints.
      deprecated: false
      x-stoplight:
        id: hyiox3fnaz85l
  '/v2/payments/{orderId}/capture':
    post:
      summary: Capture Payment
      description: |
        This endpoint captures a full or partial payment that has been authorized. Any amounts successfully captured will be settled from Afterpay to the merchant's nominated bank account on the following day. Records of all payments captured against an order are returned in the events list as events of type, "CAPTURED".

        **Note:** Authorization expires after 13 days and then the transaction is automatically voided. Voided transactions are frozen and cannot be captured, reopened or changed in any way. In this case your only option is to use the v2/checkouts endpoint to create a new order.

        This operation is idempotent based on the `requestId` (if provided), which allows the safe retry of multiple requests. This safe retry guarantees the payment operation only occurs once.

        **Connection Timeouts**
        | Timeout | Time (Seconds) |
        |---------|----------------|
        | Open    | 10             |
        | Read    | 70             |
      operationId: capture-payment
      parameters:
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
          description: 'View our <a href="https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header" target = "_blank">User Agent</a> page for formatting details'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
        - name: orderId
          in: path
          description: 'The unique ID of the Afterpay Order, returned as the `id` property of the Auth response.'
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapturePayment'
        description: ''
      responses:
        '201':
          description: 'If successful, returns an updated copy of the Payment object, with the newly captured payment appended to the `events` array as a Payment Event object with a `type` of "CAPTURED".'
          content:
            application/json:
              schema:
                $ref: ../models/Payment.yaml
        '404':
          description: 'No numeric `orderId` was provided, or an invalid string was provided. Error code `not_found`.'
        '410':
          description: 'Payment has already been fully captured for this order, or partially captured with the remainder voided. Error code `payment_captured`.'
        '412':
          description: |
            | errorCode | Description |
            | --- | --- |
            | error | A numeric `orderId` was provided, but did not match any valid order. |
            | invalid_state | The order was declined by Afterpay; no payment can be captured for this order. |
            | payment_voided | The auth for this order has already been completely voided. |
            | payment_expired | The auth for this order has expired; no further payment can be captured. |
        '422':
          description: |
            | errorCode | Description |
            | --- | --- |
            | invalid_object | The `amount` was missing or invalid, or the `paymentEventMerchantReference` exceeded 128 characters. |
            | invalid_amount | The `amount` was less than the minimum capture amount, or more than the `openToCaptureAmount`. |
        default:
          description: see additional PUT/POST errors applicable to all POST endpoints.
      deprecated: false
      x-stoplight:
        id: 70c9q0te680ux
  '/v2/payments/{orderId}/courier':
    put:
      summary: Update Shipping Courier
      description: |
        This endpoint updates an order with shipping courier information. The Afterpay team may utilise this information when providing support.

        **Connection Timeouts**
        | Timeout | Time (Seconds) |
        |---------|----------------|
        | Open    | 10             |
        | Read    | 20             |
      operationId: update-shipping-courier
      parameters:
        - name: orderId
          in: path
          description: The unique Afterpay Order ID to update.
          schema:
            type: string
          required: true
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: 'MyAfterpayModule/1.0.0 (E-Commerce Platform Name/1.0.0; PHP/7.0.0; Merchant/60032000) https://merchant.example.com'
          description: 'View our <a href="https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header" target = "_blank">User Agent</a> page for formatting details'
        - name: Accept
          in: header
          schema:
            type: string
            enum:
              - application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../models/Shipping-Courier.yaml
        description: ''
      responses:
        '200':
          description: Returns a Payment object in response.
          content:
            application/json:
              schema:
                $ref: ../models/Payment.yaml
        '412':
