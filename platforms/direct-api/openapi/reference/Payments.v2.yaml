  '/v2/payments/{orderId}/void':
    post:
      summary: Void
      description: |
        This endpoint voids the remaining `openToCapture` amount of the payment auth, and refunds the consumer.

        <!-- theme: info -->
        > 
        > Partial voids can be performed by specifying an amount in the request body. 

        This operation is idempotent based on the `requestId` (if provided), which allows for the safe retry of multiple requests, guaranteeing the payment operation is only performed once.




        **Connection Timeouts**
        | Timeout | Time (Seconds) |
        |---------|----------------|
        | Open    | 10             |
        | Read    | 70             |
      operationId: void-payment
      parameters:
        - name: orderId
          in: path
          description: 'The unique ID of the Afterpay Order, returned as the `id` property of the Auth response.'
          schema:
            type: string
          required: true
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            default: application/json
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
          description: 'View our <a href="https://afterpay.docs.buildwithfern.com/afterpay-online-developer/v-1/api-reference/online-api/request-headers/user-agent-request-header" target = "_blank">User Agent</a> page for formatting details'
        - name: Accept
          in: header
          schema:
            type: string
            default: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  $ref: ../models/Money.yaml
                  description: The amount to void. Must be less than or equal to the open to capture amount.
                requestId:
                  type: string
                  description: 'A unique request ID, required for safe retries. It is recommended that the merchant generate a UUID for each unique void.'
                reason:
                  type: string
                  description: 'Can be passed in void requests to conditionally modify wording of the corresponding consumer refund email. This can be set to 1 of 3 values, `cancelledItems`, `amountAdjustment` or `null`'
        description: ''
      responses:
        '201':
          description: |
            If successful, returns an updated copy of the Payment object.
            - A new Payment Event object will be appended to the events array, with a type of "VOIDED".
            - A new Refund object will be prepended to the refunds array.
            - If the openToCapture amount is reduced to zero as a result of this Void request, the paymentState will be updated as follows:
              - from "AUTH_APPROVED" to "VOIDED", or
              - from "PARTIALLY_CAPTURED" to "CAPTURED".
          content:
            application/json:
              schema:
                $ref: ../models/Payment.yaml
                x-examples:
                  Example 1:
                    amount:
                      amount: '100.00'
                      currency: USD
                    requestId: your_unique_request_id
                    reason: cancelledItems
        '404':
          description: The `orderId` string provided was empty or did not match a valid order. Error code `not_found`.
        '422':
          description: |
            The amount in USD has exceeded the open-to-capture amount in USD. Example message: "Void amount USD 999.00 exceeded open to capture amount USD 40.00." Error code `invalid_amount`.
        default:
          description: see additional PUT/POST errors applicable to all POST endpoints.
      deprecated: false
      x-stoplight:
        id: 34y0eg86262eg
