          maxLength: 128
          example: MMI_4vxs5egfk7hmta3qx2h6rp91x
        type:
          type: string
          example: ONE_TIME_PAYMENT
          enum:
            - ONE_TIME_PAYMENT
          description: The type of the action (`ONE_TIME_PAYMENT`).
      required:
        - scope_id
        - type
      examples: []
    OnFileDepositAction:
      title: On File Deposit Action
      description: Describes an intent for a client to deposit funds into the Cash App account balances in perpetuity until the Cash App account revokes the grant.
      type: object
      x-internal: true
      properties:
        type:
          type: string
          example: ON_FILE_DEPOSIT
          description: The type of the action (`ON_FILE_DEPOSIT`).
          enum:
            - ON_FILE_DEPOSIT
        scope_id:
          type: string
          description: |-
            ID of the client or brand that indicates the set of merchants that will deposit to customers.

            If a client ID is passed, the grant from this action can be used to create a deposit for any merchant owned by the client.

            If a brand ID is passed, the grant from this action can be used to create a deposit for any merchant that has a matching brand ID.
            Min length: `1`
            Max length: `128`
          minLength: 1
          example: MMI_4vxs5egfk7hmta3qx2h6rp91x
          maxLength: 128
        account_reference_id:
          type: string
          description: Identifier of the account or customer associated to the on file action.
      required:
        - type
        - scope_id
        - account_reference_id
    OnFilePayoutAction:
      title: On File Payout Action
      description: Describes an intent for a client to payout funds from the Cash App account balances in perpetuity until the Cash App account revokes the grant.
      type: object
      properties:
        type:
          type: string
          example: ON_FILE_PAYOUT
          description: The type of the action (`ON_FILE_PAYOUT`).
          enum:
            - ON_FILE_PAYOUT
        scope_id:
          type: string
          description: |-
            ID of the client or brand that indicates the set of merchants that will payout to customers.

            If a client ID is passed, the grant from this action can be used to create a payout for any merchant owned by the client.

            If a brand ID is passed, the grant from this action can be used to create a payout for any merchant that has a matching brand ID.

            Merchant IDs may *not* be passed.

            Min length: `1`
            Max length: `128`
          minLength: 1
          example: BRAND_8ereg0tug2yiik8vx24xpe5br
          maxLength: 128
        account_reference_id:
          type: string
          description: Identifier of the account or customer associated to the on file action.
      required:
        - type
        - scope_id
    CheckingBalanceAction:
      title: Checking Balance Action
      x-fern-availability: beta
      description: |-
        Describes an intent for a client to read a customer's Cash App checking balance until the customer revokes the grant.

        **Beta:** This action is in beta.
      type: object
      properties:
        type:
          type: string
          example: CHECKING_BALANCE
          description: The type of the action (`CHECKING_BALANCE`).
          enum:
            - CHECKING_BALANCE
        scope_id:
          type: string
          description: |-
            ID of the client or brand requesting access to read the customer's balances.

            If a client ID is passed, the grant from this action can be used to read balances on behalf of the client.

