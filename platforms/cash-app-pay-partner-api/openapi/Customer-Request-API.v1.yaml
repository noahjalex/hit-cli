            Merchant IDs may *not* be passed.

            Min length: `1`
            Max length: `128`
          minLength: 1
          example: BRAND_8ereg0tug2yiik8vx24xpe5br
          maxLength: 128
      required:
        - type
        - scope_id
    OnFilePaymentAction:
      type: object
      title: On File Payment Action
      description: "Describes an\_intent for a client to store a customer's account, allowing a client to create payments or issue refunds for it on a recurring basis."
      additionalProperties: false
      properties:
        scope_id:
          type: string
          description: |-
            ID of the client or brand that will charge customers.

            If a client ID is passed, the grant from this action can be used to create a payment for any merchant owned by the client.

            If a brand ID is passed, the grant from this action can be used to create a payment for any merchant that has a matching brand ID.

            Merchant IDs may *not* be passed.

            Min length: `1`
            Max length: `128`
          minLength: 1
          example: BRAND_8ereg0tug2yiik8vx24xpe5br
          maxLength: 128
        type:
          type: string
          default: ON_FILE_PAYMENT
          enum:
            - ON_FILE_PAYMENT
          description: The type of the action (`ON_FILE_PAYMENT`).
        account_reference_id:
          type: string
