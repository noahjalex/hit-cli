webhooks:
  customer_request.state.updated:
    post:
      operationId: customerRequestStateUpdated
      tags:
        - Requests
      summary: 'Event: customer_request.state.updated'
      description: |-
        **When is this event triggered?**

        This event is created whenever a customer request's state is updated. This is typically caused by a customer approving or declining the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - event_id
                - created_at
                - data
              properties:
                type:
                  type: string
                  description: The type of event that occurred. `customer_request.state.updated` for this event.
                  example: customer_request.state.updated
                event_id:
                  type: string
                  description: A unique identifier provided by Cash App for the event.
                  example: WE_a61xp8sny73j557bacysv4wkh
                created_at:
                  type: string
                  format: date-time
                  description: |-
                    When this event occured in [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339) format (UTC).

                    The time that the event is delivered may be significantly later than this timestamp due to webhooks being retried for up to 72 hours.
                data:
                  description: Data about the customer request that was updated.
                  type: object
                  required:
                    - id
                    - object
                    - type
                  properties:
                    id:
                      type: string
                      description: A unique identifier provided by Cash App for the customer request.
                      example: GRR_1hrxhz136krcq6ezdte2ha5q
                    object:
                      type: object
                      description: A snapshot of the customer request data immediately after the customer request's state was updated.
                      required:
                        - request
                      properties:
                        request:
                          $ref: '#/components/schemas/Request'
                    type:
                      type: string
                      description: 'The resource type contained in the `object` field. For this event, it is `customer_request`.'
                      example: customer_request
            examples:
              default:
                value:
                  type: customer_request.state.updated
                  event_id: WE_a61xp8sny73j557bacysv4wkh
                  created_at: "2019-08-24T14:15:22Z"
                  data:
                    id: GRR_1hrxhz136krcq6ezdte2ha5q
                    type: customer_request
                    object:
                      request:
                        id: GRR_1hrxhz136krcq6ezdte2ha5q
                        status: APPROVED
                        actions:
                          - scope_id: MMI_4vxs5egfk7hmta3qx2h6rp91x
                            amount: 2500
                            currency: USD
                            type: ONE_TIME_PAYMENT
                        channel: ONLINE
                        created_at: "2019-08-24T14:15:22Z"
                        updated_at: "2019-08-24T14:15:22Z"
