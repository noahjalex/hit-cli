          reference_id: CUST_123
    Dispute:
      x-tags:
        - Disputes
      type: object
      title: Dispute
      description: Represents a dispute initiated by a customer within Cash App or the customer's linked bank
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          example: DSPT_1fbjn9dg7rmz1xeyv6gkyh8vg
          description: |-
            A unique identifier for the dispute issued by Cash App.

            Min length: `1`
            Max length: `128`
        payment_id:
          type: string
          minLength: 1
          maxLength: 128
          example: PWC_4nn21zy6t0v2yhqg5bvhk7xkq
          description: |-
            ID of the disputed payment.

            Min length: `1`
            Max length: `128`
        amount:
          type: integer
          example: 1500
          description: |-
            Amount of disputed money, in the lowest denomination of currency on the associated payment.

            Min value: `1`
          minimum: 1
        customer_credited_amount:
          type: integer
          example: 1250
          minimum: 0
          description: |-
            The amount credited to the Customer after resolving the dispute. 

            Note: The amount will be in the lowest denomination of the currency used on the associated payment.

            Min value: `0`
          nullable: true
        reason:
          type: string
          enum:
            - FR10
            - FR11
            - PE10
            - PE11
            - PE12
            - CD10
            - CD11
            - CD13
          description: |-
            4-digit code consisting of 2 letters followed by 2 numbers that indicates why the dispute was created, at a high level.

            Current values:

            - `FR10`: Customer has no knowledge of the payment.
            - `FR11`: Customer has no knowledge of the payment and liability has shifted to the merchant due to collusion, fraud monitoring program thresholds, or any other reason.
            - `PE10`: Payment was processed twice.
            - `PE11`: Payment amount differs from agreed amount.
            - `PE12`: Payment was paid for by another means.
            - `CD10`: Cancelled services.
            - `CD11`: Goods or services differ from what was agreed upon for the payment.
            - `CD12`: The goods or services were not received.
            - `CD13`: The purchase was cancelled or returned, but the refund has not been processed.
          minLength: 4
          maxLength: 4
          example: FR10
        settlement_withholding:
          type: string
          enum:
            - NOT_WITHHELD
            - WITHHELD_ALREADY
          description: |-
            Indicates if the disputed amount has already been withheld from a settlement or not.

            Current values:

            - `NOT_WITHHELD`: The disputed amount has not yet been withheld in a settlement. It may impact future settlements if the dispute is "lost" by the merchant.

            - `WITHHELD_ALREADY`: The disputed amount was withheld in a prior settlement. This dispute will not impact future settlements.
        state:
          type: string
          enum:
            - RESPONSE_REQUIRED
            - NO_RESPONSE_REQUIRED
            - PROCESSING
            - ACCEPTED
            - WON
            - PARTIALLY_WON
            - LOST
          example: RESPONSE_REQUIRED
          description: |-
            The step in the dispute lifecycle that this dispute is currently at:

            - `RESPONSE_REQUIRED`
            - `NO_RESPONSE_REQUIRED`
            - `PROCESSING`
            - `ACCEPTED`
            - `WON`
            - `PARTIALLY_WON`
            - `LOST`
        created_at:
          type: string
          format: date-time
          description: 'When this dispute was created, in [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339) format (UTC).'
          example: '2022-01-01T12:00:00Z'
        response_due_at:
          type: string
          format: date-time
          description: 'When the dispute must be challenged by, after which it will be automatically accepted, in [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339) format (UTC).'
          example: '2022-05-01T00:00:00Z'
          nullable: true
        updated_at:
          type: string
          format: date-time
          description: 'When this dispute was last updated, in [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339) format (UTC).'
          example: '2022-01-05T12:00:00Z'
        merchant_id:
          type: string
          minLength: 1
          maxLength: 128
          example: MMI_4vxs5egfk7hmta3qx2h6rp91x
          description: |-
            ID of the merchant that collected the disputed payment.

            Min length: `1`
            Max length: `128`
      required:
        - id
        - payment_id
        - amount
        - reason
        - settlement_withholding
        - state
        - created_at
        - updated_at
        - merchant_id
      examples:
        - id: DSPT_1fbjn9dg7rmz1xeyv6gkyh8vg
          payment_id: PWC_4nn21zy6t0v2yhqg5bvhk7xkq
          amount: 1500
          customer_credited_amount: 1250
          reason: FR10
          settlement_withholding: NOT_WITHHELD
          state: RESPONSE_REQUIRED
          created_at: '2022-01-01T12:00:00Z'
          response_due_at: '2022-05-01T00:00:00Z'
          updated_at: '2022-01-05T12:00:00Z'
          merchant_id: MMI_4vxs5egfk7hmta3qx2h6rp91x
    DisputeEvidence:
      x-tags:
        - Disputes
      type: object
      title: DisputeEvidence
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          example: EVD_dbdda8e161b7bad8519f7f73
          description: |-
            A unique identifier for the dispute evidence issued by Cash App.

            Min length: `1`
            Max length: `128`
        dispute_id:
          type: string
          minLength: 1
          maxLength: 128
          example: DSPT_1fbjn9dg7rmz1xeyv6gkyh8vg
          description: |-
            ID of the dispute this evidence is associated with.

            Min length: `1`
            Max length: `128`
        category:
          type: string
          enum:
            - GENERIC_EVIDENCE
            - ONLINE_OR_APP_ACCESS_LOG
            - AUTHORIZATION_DOCUMENTATION
            - CANCELLATION_OR_REFUND_DOCUMENTATION
            - CARDHOLDER_COMMUNICATION
            - CARDHOLDER_INFORMATION
            - PURCHASE_ACKNOWLEDGEMENT
            - DUPLICATE_CHARGE_DOCUMENTATION
            - PRODUCT_OR_SERVICE_DESCRIPTION
            - RECEIPT
            - SERVICE_RECEIVED_DOCUMENTATION
            - PROOF_OF_DELIVERY_DOCUMENTATION
            - RELATED_TRANSACTION_DOCUMENTATION
            - REBUTTAL_EXPLANATION
            - TRACKING_NUMBER
          description: |-
            Describes what type of information is contained in this piece of evidence.

            Current values:

            - `GENERIC_EVIDENCE`: Default evidence type used if no other category applies.
            - `ONLINE_OR_APP_ACCESS_LOG`: Server or activity logs that show proof of the cardholder’s identity and that the cardholder successfully ordered and received the goods (digitally or otherwise). Example evidence includes IP addresses, corresponding timestamps/dates, cardholder’s name and email address linked to a cardholder profile held by the seller, proof the same device and card (used in dispute) were previously used in prior undisputed transaction, and any related detailed activity.
            - `AUTHORIZATION_DOCUMENTATION`: **[File Only]** Evidence that the cardholder did provide authorization for the charge. Example evidence includes a signed credit card authorization.
            - `CANCELLATION_OR_REFUND_DOCUMENTATION`: Evidence that the cardholder acknowledged your refund or cancellation policy. Example evidence includes a signature or checkbox showing the cardholder’s acknowledgement of your refund or cancellation policy.
            - `CARDHOLDER_COMMUNICATION`: **[File Only]** Evidence that shows relevant communication with the cardholder. Example evidence includes emails or texts that show the cardholder received goods/services or demonstrate cardholder satisfaction.
            - `CARDHOLDER_INFORMATION`: Evidence that validates the customer's identity. Example evidence includes personally identifiable details such as name, email address, purchaser IP address, and a copy of the cardholder ID.
            - `PURCHASE_ACKNOWLEDGEMENT`: Evidence that shows proof of the sale/transaction. Example evidence includes an invoice, contract, or other item showing the customer’s acknowledgement of the purchase and your terms.
            - `DUPLICATE_CHARGE_DOCUMENTATION`: **[File Only]** Evidence that shows the charges in question are valid and distinct from one another. Example evidence includes receipts, shipping labels, and invoices along with their distinct payment IDs.
            - `PRODUCT_OR_SERVICE_DESCRIPTION`: A description of the product or service sold.
            - `RECEIPT`: A receipt or message sent to the cardholder detailing the charge. Note: You do not need to upload the Square receipt; Square submits the receipt on your behalf.
            - `SERVICE_RECEIVED_DOCUMENTATION`: Evidence that the service was provided to the cardholder or the expected date that services will be rendered. Example evidence includes a signed delivery form, work order, expected delivery date, or other written agreements.
            - `PROOF_OF_DELIVERY_DOCUMENTATION`: Evidence that shows the product was provided to the cardholder or the expected date of delivery. Example evidence includes a signed delivery form or written agreement acknowledging receipt of the goods or services.
            - `RELATED_TRANSACTION_DOCUMENTATION`: Evidence that shows the cardholder previously processed transactions on the same card and did not dispute them.
            - `REBUTTAL_EXPLANATION`: An explanation of why the cardholder’s claim is invalid. Example evidence includes an explanation of why each distinct charge is a legitimate purchase, why the cardholder’s claim for credit owed due to their attempt to cancel, return, or refund is invalid per your stated policy and cardholder agreement, or an explanation of how the cardholder did not attempt to remedy the issue with you first to receive credit.
            - `TRACKING_NUMBER`: The tracking number for the order provided by the shipping carrier. If you have multiple numbers, they need to be submitted individually as separate pieces of evidence.
        file:
          type: object
          description: 'If the evidence is of type `FILE`, contains metadata about the binary file uploaded as evidence.'
          additionalProperties: false
          properties:
            filename:
              type: string
              minLength: 1
              maxLength: 40
              description: Name of the uploaded file. It should be descriptive enough to indicate what type of information is contained in the uploaded file.
            content_type:
              type: string
              enum:
                - application/pdf
                - image/heic
                - image/heif
                - image/jpeg
                - image/png
                - image/tiff
              description: |-
                The MIME type of the uploaded file.

                Current values:

                - `application/pdf`
                - `image/heic`
                - `image/heif`
                - `image/jpeg`
                - `image/png`
                - `image/tiff`
          required:
            - filename
            - content_type
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: |-
            If the evidence is of type `TEXT`, contains the blob of text created as evidence.

            Min length: `1`
            Max length: `500`
        type:
          type: string
          enum:
            - FILE
            - TEXT
          example: TEXT
          description: |-
            Indicates if the evidence is a file or plain text.

            Current values:
            - `TEXT`: The evidence is a blob of text under 500 characters.
            - `FILE`: The evidence is an uploaded binary file.
        created_at:
          type: string
          format: date-time
          description: 'When this evidence was created, in [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339) format (UTC).'
          example: '2022-01-01T12:00:00Z'
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
        - id
        - dispute_id
        - category
        - type
        - created_at
    Grant:
      type: object
      title: grant
      description: Describes a grant that can be used to perform actions specified in a customer request using the Network API.
      additionalProperties: false
      properties:
        id:
          type: string
          description: |-
            Unique identifier for this grant issued by Cash App.

            Min length: `1`
            Max length: `256`
          minLength: 1
          maxLength: 256
          example: GRG_221243dc6985a6819ff6950c1a21332f7bc4a46ebd49b5a7002908ab768e8e5ff7831e084d0d2c9d8d939793b55eff50
        customer_id:
          type: string
          description: |-
            ID of the customer that approved this grant.

            Min length: `1`
            Max length: `128`
          minLength: 1
          maxLength: 128
          example: CST_AQmxh4y_QGoNNIG5NUw0jttqyYedL1LklACQdyJ3H-Vs6WmLtP6A_C7XjQNohvY
        request_id:
          type: string
          description: |-
            A unique identifier issued by Cash App for the customer request that resulted in the creation of this grant.

            Min length: `1`
            Max length: `128`
          minLength: 1
          maxLength: 128
          example: GRR_1hrxhz136krcq6ezdte2ha5q
        action:
          $ref: ./Customer-Request-API.v1.yaml#/components/schemas/Action
        status:
          type: string
          enum:
            - ACTIVE
            - CONSUMED
            - REVOKED
            - EXPIRED
          description: |-
            Describes whether or not this grant can be used to perform the action associated with it.

            If `ACTIVE`, it can be used to perform the action.

            If `EXPIRED`, it may no longer be used to perform the action due to the current time being past the "expires_at" time.

            If `CONSUMED`, it was already redeemed to perform the action and cannot be used again.

            If `REVOKED`, the customer or merchant explicitly unauthorized the grant, preventing it from being used to perform the action.
        type:
          type: string
          enum:
            - ONE_TIME
            - EXTENDED
          description: Describes whether this grant can be only be used once (`ONE_TIME`) or repeatedly (`EXTENDED`).
          example: ONE_TIME
        channel:
          $ref: ./Customer-Request-API.v1.yaml#/components/schemas/Channel
        created_at:
          type: string
          format: date-time
          description: 'When this grant was created, in [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339) format (UTC).'
          example: '2022-01-01T12:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: 'When this grant was last updated, in [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339) format (UTC).'
          example: '2022-01-01T12:01:00Z'
        expires_at:
          type: string
          format: date-time
          description: |-
            If present, indicates when the grant's status will become `EXPIRED`, preventing a client from using it to create payments or refunds.

            The timestamp is in the [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339) format (UTC).
          example: '2022-04-01T12:00:00Z'
      required:
        - id
        - customer_id
        - request_id
        - action
        - status
        - type
        - channel
        - created_at
        - updated_at
      examples:
        - id: GRG_221243dc6985a6819ff6950c1a21332f7bc4a46ebd49b5a7002908ab768e8e5ff7831e084d0d2c9d8d939793b55eff50
