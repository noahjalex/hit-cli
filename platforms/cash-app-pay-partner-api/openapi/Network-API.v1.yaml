openapi: 3.1.0
info:
  title: Network API
  version: '1.0'
  description: 'The Cash App Network API connects clients to process transactions on the Cash App network, including functionality for creating payments and refunds, managing disputes, onboarding merchants, and storing customers for on-file payments.'
  contact:
    url: 'https://developers.cash.app'
    email: developers@cash.app
    name: Cash App
  termsOfService: 'https://cash.app/legal/us/en-us/tos'
servers:
  - url: 'https://api.cash.app/network/v1'
    description: Production
  - url: 'https://sandbox.api.cash.app/network/v1'
    description: Sandbox
paths:
  /brands:
    parameters:
      - $ref: ./components/parameters/Region.yaml
      - $ref: ./components/parameters/Signature.yaml
      - $ref: ./components/parameters/Accept.yaml
    get:
      summary: List brands
      tags:
        - Brands
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  brands:
                    type: array
                    minItems: 0
                    uniqueItems: true
                    maxItems: 100
                    description: List of brands matching the given query parameters.
                    items:
                      $ref: '#/components/schemas/Brand'
                  cursor:
                    type: string
                    description: 'The pagination cursor to be used in a subsequent request. If empty, this is the final response.'
                required:
                  - brands
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: list-brands
      description: |-
        Returns a list of brands matching the given query parameters.

        **This endpoint is rate limited to 50 QPS.**

        Scopes: `BRANDS_READ`
      parameters:
        - schema:
            type: string
            minLength: 1
          in: query
          description: A pagination cursor returned by a previous call to this endpoint. Provide this cursor to retrieve the next set of results for the original query.
          name: cursor
        - schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 50
          in: query
          name: limit
          description: Maximum number of brands to return.
        - schema:
            type: string
            minLength: 1
            maxLength: 1024
          in: query
          name: reference_id
          description: Filters results to only include brands with a `reference_id` matching the given value.
      security:
        - Client:
            - BRANDS_READ
    post:
      summary: Create brand
      operationId: create-brand
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  brand:
                    $ref: '#/components/schemas/Brand'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: |-
        Creates a new brand with the given attributes.

        **This endpoint is not rate limited.**

        Scopes: `BRANDS_WRITE`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - idempotency_key
                - brand
              properties:
                idempotency_key:
                  $ref: '#/components/schemas/IdempotencyKey'
                brand:
                  type: object
                  description: Details about the brand to create.
                  additionalProperties: false
                  required:
                    - name
                    - reference_id
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 1024
                      description: |-
                        Name of the brand to be shown in Cash App next to payments.

                        Min length: `1`
                        Max length: `1024`
                    reference_id:
                      type: string
                      description: |-
                        A user-defined identifier for this brand, typically used to associate the brand with a record in an external system.

                        **Must be unique across all brands. Independent from the [merchant reference_id](https://developers.cash.app/docs/api/network-api/operations/create-a-merchant#request-body)**

                        Min length: `1`
                        Max length: `1024`
                      minLength: 1
                      maxLength: 1024
                    profile_image_url:
                      type: string
                      description: |-
                        URL to the image that should be shown in Cash App next to payments made to this brand, typically the brand's logo.

                        The image should be square and be at least 256x256. It must be less than 2MB in filesize.

                        Acceptable image formats:
                        - `png`
                        - `jpg`
                        - `jpeg`

                        Min length: `8`
                        Max length: `8000`
                      format: uri
                      minLength: 1
                      maxLength: 1024
                    color:
                      type: string
                      description: |-
                        Primary color associated with this brand and its logo, in 6-digit hex code format.

                        Pattern: `^#[a-fA-F0-9]{6}$`
                        Min length: `7`
                        Max length: `7`
                      pattern: '^#[a-fA-F0-9]{6}$'
                      minLength: 7
                      maxLength: 7
                      example: '#ffffff'
                    metadata:
                      $ref: '#/components/schemas/Metadata'
            examples:
              Sample request with metadata:
                value:
                  idempotency_key: e345c3fb-1caa-46fd-b0d3-aa6c7b00ab19
                  brand:
                    name: brand name
                    reference_id: reference ID
                    profile_image_url: 'https://example.com'
                    color: '#ffffff'
                    metadata:
                      key: value
              Sample request without metadata:
                value:
                  idempotency_key: e345c3fb-1caa-46fd-b0d3-aa6c7b00ab19
                  brand:
                    name: brand name
                    reference_id: reference ID
                    profile_image_url: 'https://example.com'
                    color: '#ffffff'
                    metadata:
                      key: value
        description: ''
      tags:
        - Brands
      security:
        - Client:
            - BRANDS_WRITE
    put:
      summary: Upsert brand
      operationId: upsert-brand
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  brand:
                    $ref: '#/components/schemas/Brand'
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  brand:
                    $ref: '#/components/schemas/Brand'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Brands
      description: |-
        Creates or updates a brand based on the brand's `reference_id`.

        If a brand with a matching `reference_id` is found, 
        it will be updated. Ensure proper mapping; if no matching brand is found, 
        a new one will be created. 

        The HTTP response code (`200 OK` or `201 Created`) indicates
        whether the resource was updated or created, respectively.

        <Info>
        <b><code>brand_id</code></b> is the primary unique identifier for all Brand APIs.<br/>
        Be cautious when using <code>reference_id</code> as a unique identifier.
        </Info>

        **This endpoint is not rate limited.**

        Scopes: `BRANDS_WRITE`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - brand
              properties:
                brand:
                  type: object
                  description: Details about the brand to create or update.
                  additionalProperties: false
                  required:
                    - name
                    - reference_id
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 255
                      description: |-
                        Name of the brand to be shown in Cash App next to payments.

                        Min length: `1`
                        Max length: `1024`
                    reference_id:
                      type: string
                      minLength: 1
                      maxLength: 1024
                      description: |-
                        A user-defined identifier for this brand, typically used to associate the brand with a record in an external system.

                        **Must be unique across all brands.  Independent from the [merchant reference_id](https://developers.cash.app/docs/api/network-api/operations/create-a-merchant#request-body)**

                        Min length: `1`
                        Max length: `1024`
                    profile_image_url:
                      type: string
                      minLength: 1
                      maxLength: 1024
                      description: |-
                        URL to the image that should be shown in Cash App next to payments made to this brand, typically the brand's logo.

                        The image should be square and be at least 256x256. It must be less than 2MB in filesize.

                        Acceptable image formats:
                        - `png`
                        - `jpg`
                        - `jpeg`

                        Min length: `8`
                        Max length: `8000`
                      format: uri
                    color:
                      type: string
                      minLength: 7
                      maxLength: 7
                      description: |-
                        Primary color associated with this brand and its logo, in 6-digit hex code format.

                        Pattern: `^#[a-fA-F0-9]{6}$`
                        Min length: `7`
                        Max length: `7`
                      pattern: '^#[a-fA-F0-9]{6}$'
                      example: '#ffffff'
                    metadata:
                      $ref: '#/components/schemas/Metadata'
            examples:
              Sample request with metadata:
                value:
                  brand:
                    name: brand name
                    reference_id: reference ID
                    profile_image_url: 'https://example.com'
                    color: '#ffffff'
                    metadata:
                      key: value
              Sample request without metadata:
                value:
                  brand:
                    name: brand name
                    reference_id: reference ID
                    profile_image_url: 'https://example.com'
                    color: '#ffffff'
        description: ''
      security:
        - Client:
            - BRANDS_WRITE
  '/brands/{brand_id}':
    parameters:
      - schema:
          type: string
          example: B_jsrnuiix
          minLength: 1
          maxLength: 128
        name: brand_id
        in: path
        required: true
        description: ID of the brand.
      - $ref: ./components/parameters/Region.yaml
      - $ref: ./components/parameters/Signature.yaml
      - $ref: ./components/parameters/Accept.yaml
    get:
      summary: Retrieve brand
      tags:
        - Brands
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  brand:
                    $ref: '#/components/schemas/Brand'
                required:
                  - brand
              examples:
                Example:
                  value:
                    brand:
                      id: string
                      name: string
                      profile_image_url: 'https://example.com'
                      color: '#ffffff'
                      reference_id: string
                      created_at: '2021-01-01T00:00:00Z'
                      updated_at: '2021-01-01T00:00:00Z'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Example:
                  value:
                    errors:
                      - category: INVALID_REQUEST_ERROR
                        code: BRAND_NOT_FOUND
                        detail: No brand was found for the given ID.
      operationId: retrieve-brand
      description: |-
        Returns a brand matching the given `brand_id`.

        **This endpoint is not rate limited.**

        Scopes: `BRANDS_READ`
      security:
        - Client:
            - BRANDS_READ
    patch:
      summary: Update brand
      operationId: update-brand
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  brand:
                    $ref: '#/components/schemas/Brand'
              examples:
                Example:
                  value:
                    brand:
                      id: B_jsrnuiix
                      name: Out of this World
                      profile_image_url: 'https://example.com'
                      color: '#ffffff'
                      reference_id: external-id
                      created_at: '2021-01-01T00:00:00Z'
                      updated_at: '2021-01-01T00:00:00Z'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid Color:
                  value:
                    errors:
                      - category: INVALID_REQUEST_ERROR
                        code: VALUE_REGEX_MISMATCH
                        detail: 'Expected brand.color to match pattern: ^#[a-fA-F0-9]{6}$.'
                        field: brand.color
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - brand
              properties:
                brand:
                  type: object
                  description: Details about the brand to update
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      minLength: 1
                      description: |-
                        Name of the brand to be shown in Cash App next to payments.

                        *This field cannot be cleared.*

                        Min length: `1`
                        Max length: `1024`
                      maxLength: 1024
                      example: My Brand
                    reference_id:
                      type: string
                      minLength: 1
                      description: |-
                        A user-defined identifier for this brand, typically used to associate the brand with a record in an external system.  Independent from the [merchant reference_id](https://developers.cash.app/docs/api/network-api/operations/create-a-merchant#request-body).

                        *This field cannot be cleared, and must be unique across all brands.*

                        Min length: `1`
                        Max length: `1024`
                      example: example-id
                    profile_image_url:
                      type: string
                      description: |-
                        URL to the image that should be shown in Cash App next to payments made to this brand, typically the brand's logo.

                        The image should be square and be at least 256x256. It must be less than 2MB in filesize.

                        Acceptable image formats:
                        - `png`
                        - `jpg`
                        - `jpeg`

                        *This field cannot be cleared.*

                        Min length: `8`
                        Max length: `8000`
                      minLength: 8
                      maxLength: 8000
                      format: uri
                    color:
                      type: string
                      description: |-
                        Primary color associated with this brand and its logo, in 6-digit hex code format.

                        Pattern: `^#[a-fA-F0-9]{6}$`
                        Min length: `7`
                        Max length: `7`
                      minLength: 7
                      maxLength: 7
                      pattern: '^#[a-fA-F0-9]{6}$'
                      example: '#ffffff'
                      nullable: true
                    metadata:
                      $ref: '#/components/schemas/Metadata'
            examples:
              Sample request with metadata:
                value:
                  brand:
                    name: Out of this World
                    profile_image_url: 'https://example.com'
                    color: '#ffffff'
                    reference_id: external-id
                    metadata:
                      key: value
              Sample request without metadata:
                value:
                  brand:
                    name: Out of this World
                    profile_image_url: 'https://example.com'
                    color: '#ffffff'
                    reference_id: external-id
        description: ''
      description: |-
        Updates a brand matching the provided `brand_id` with the given attributes.

        To clear a field, set it to `null`. Fields that are not provided in the request will not be changed.

        **This endpoint is not rate limited.**

        Scopes: `BRANDS_WRITE`
      tags:
        - Brands
      security:
        - Client:
            - BRANDS_WRITE
  /merchants:
    parameters:
      - $ref: ./components/parameters/Region.yaml
      - $ref: ./components/parameters/Signature.yaml
      - $ref: ./components/parameters/Accept.yaml
    get:
      summary: List merchants
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  merchants:
                    type: array
                    uniqueItems: true
                    maxItems: 100
                    minItems: 0
                    description: List of merchants matching the given query parameters.
                    items:
                      $ref: '#/components/schemas/Merchant'
                  cursor:
                    type: string
                    description: 'The pagination cursor to be used in a subsequent request. If empty, this is the final response.'
                    minLength: 1
                required:
                  - merchants
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/Error'
                required:
                  - errors
          headers: {}
      operationId: list-merchants
      description: |-
        Returns a list of merchants matching the given query parameters.

        **This endpoint is rate limited to 50 QPS.**

        Scopes: `MERCHANTS_READ`
      parameters:
        - schema:
            type: string
            minLength: 1
            maxLength: 1024
          in: query
          name: reference_id
          description: Filters results to only include merchants with a `reference_id` matching the given value.
        - schema:
            type: string
            minLength: 1
          in: query
          name: cursor
          description: A pagination cursor returned by a previous call to this endpoint. Provide this cursor to retrieve the next set of results for the original query.
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          in: query
          name: limit
          description: Maximum number of merchants to return.
      tags:
        - Merchants
      security:
        - Client:
            - MERCHANTS_READ
    post:
      summary: Create merchant
      operationId: create-merchant
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                description: ''
                additionalProperties: false
                properties:
                  merchant:
                    $ref: '#/components/schemas/Merchant'
                required:
                  - merchant
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Example:
                  value:
                    errors:
                      - category: INVALID_REQUEST_ERROR
                        code: CONFLICT
                        detail: The reference_id 'external-id' is already used by another merchant.
                        field: merchant.reference_id
      description: |-
        Creates a new merchant. Merchants must have an `address` or `site_url` set.

        **This endpoint is not rate limited.**

        Scopes: `MERCHANTS_WRITE`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - idempotency_key
                - merchant
              properties:
                idempotency_key:
                  $ref: '#/components/schemas/IdempotencyKey'
                merchant:
                  type: object
                  description: Details about the merchant to create.
                  additionalProperties: false
                  required:
                    - name
                    - brand_id
                    - country
                    - currency
                    - category
                    - reference_id
                    - address
                  properties:
                    name:
                      type: string
                      description: |-
                        The name of the individual or business entity associated with the merchant.

                        Min length: `1`
                        Max length: `1024`
                      minLength: 1
                      maxLength: 1024
                    brand_id:
                      type: string
                      description: |
                        ID of the brand associated with this merchant.

                        Min length: `1`
                        Max length: `128`
                      minLength: 1
                      maxLength: 128
                    country:
                      $ref: '#/components/schemas/Country'
                    currency:
                      $ref: '#/components/schemas/Currency'
                    category:
                      $ref: '#/components/schemas/Category'
                    reference_id:
                      type: string
                      description: |-
                        A user-defined identifier for this merchant, typically used to associate the merchant with a record in an external system.

                        **Must be unique across all merchants. Independent from the [brand reference_id](https://developers.cash.app/docs/api/network-api/operations/create-a-brand#request-body)**

                        Min length: `1`
                        Max length: `1024`
                      minLength: 1
                      maxLength: 1024
                      example: external-id
                    address:
                      $ref: '#/components/schemas/Address'
                    site_url:
                      type: string
                      description: |-
                        The URL of the website, if this merchant is for an eCommerce site.

                        Min length: `8`
                        Max length: `8000`
                      format: uri
                      example: 'https://example.com'
                      minLength: 8
                      maxLength: 8000
                    metadata:
                      $ref: '#/components/schemas/Metadata'
                    default_fee_plans:
                      $ref: '#/components/schemas/MerchantFeePlans'
            examples:
              Sample request with metadata:
                value:
                  idempotency_key: e345c3fb-1caa-46fd-b0d3-aa6c7b00ab19
                  merchant:
                    name: merchant name
                    brand_id: brand ID
                    country: US
                    currency: USD
                    category: '5432'
                    reference_id: reference ID
                    address:
                      address_line_1: 1215 4th Ave
                      address_line_2: Suite 2300
                      locality: Seattle
                      country: US
                      postal_code: 98161-1001
                      administrative_district_level_1: Washington
                    site_url: 'https://example.com'
                    metadata:
                      key: value
                    default_fee_plans:
                      in_app_fee_plan_id: FEE_kewjsmjt35t8qhzyjeqcst5me
                      in_person_fee_plan_id: FEE_kewjsmjt35t8qhzyjeqcst5me
                      online_fee_plan_id: FEE_kewjsmjt35t8qhzyjeqcst5me
              Sample request without metadata:
                value:
                  idempotency_key: e345c3fb-1caa-46fd-b0d3-aa6c7b00ab19
                  merchant:
                    name: merchant name
                    brand_id: brand ID
                    country: US
                    currency: USD
                    category: '5432'
                    reference_id: reference ID
                    address:
                      address_line_1: 1215 4th Ave
                      address_line_2: Suite 2300
                      locality: Seattle
                      country: US
                      postal_code: 98161-1001
                      administrative_district_level_1: Washington
                    site_url: 'https://example.com'
                    default_fee_plans:
                      in_app_fee_plan_id: FEE_kewjsmjt35t8qhzyjeqcst5me
                      in_person_fee_plan_id: FEE_kewjsmjt35t8qhzyjeqcst5me
                      online_fee_plan_id: FEE_kewjsmjt35t8qhzyjeqcst5me
        description: ''
      tags:
        - Merchants
      security:
        - Client:
            - MERCHANTS_WRITE
    put:
      summary: Upsert merchant
      operationId: upsert-merchant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  merchant:
                    $ref: '#/components/schemas/Merchant'
                required:
                  - merchant
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  merchant:
                    $ref: '#/components/schemas/Merchant'
                required:
                  - merchant
            application/xml:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: |-
        Creates or updates a merchant based on the merchant's `reference_id`.

        If a merchant with a matching `reference_id` is found, 
        it will be updated. If no matching merchant is found,
        a new one will be created.

        The HTTP response code (`200 OK` or `201 Created`) indicates
        whether the resource was updated or created, respectively.

        <Info>
         `merchant_id` is the primary unique identifier for all Merchant APIs.
         Be cautious when using `reference_id` as a unique identifier.
        
         Merchants must have an `address` or `site_url` set.
         </Info>


        **This endpoint is not rate limited.**

        Scopes: `MERCHANTS_WRITE`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - merchant
              properties:
                merchant:
                  type: object
                  description: Details about the merchant to create or update.
                  additionalProperties: false
                  required:
                    - name
                    - brand_id
                    - country
                    - currency
                    - category
                    - reference_id
                    - address
                  properties:
                    name:
                      type: string
                      description: |-
                        The name of the individual or business entity associated with the merchant.

                        Min length: `1`
                        Max length: `1024`
                      minLength: 1
                      maxLength: 1024
                    brand_id:
                      type: string
                      description: |-
                        ID of the brand associated with this merchant.

                        Min length: `1`
                        Max length: `128`
                      minLength: 1
                      maxLength: 128
                    country:
                      $ref: '#/components/schemas/Country'
                    currency:
                      $ref: '#/components/schemas/Currency'
                    category:
                      $ref: '#/components/schemas/Category'
                    reference_id:
                      type: string
                      description: |-
                        A user-defined identifier for this merchant, typically used to associate the merchant with a record in an external system.

                        **Must be unique across all merchants. Independent from the [brand reference_id](https://developers.cash.app/docs/api/network-api/operations/create-a-brand#request-body).**

                        Min length: `1`
                        Max length: `1024`
                      minLength: 1
                      maxLength: 1024
                    address:
                      $ref: '#/components/schemas/Address'
                    site_url:
                      type: string
                      format: uri
                      description: |-
                        The URL of the website, if this merchant is for an eCommerce site.

                        Min length: `8`
                        Max length: `8000`
                      minLength: 8
                      maxLength: 8000
                    metadata:
                      $ref: '#/components/schemas/Metadata'
                    default_fee_plans:
                      $ref: '#/components/schemas/MerchantFeePlans'
            examples:
              Sample request with metadata:
                value:
                  merchant:
                    name: merchant name
                    brand_id: brand ID
                    country: US
                    currency: USD
                    category: '5432'
                    reference_id: reference ID
                    address:
                      address_line_1: 1215 4th Ave
                      address_line_2: Suite 2300
                      locality: Seattle
                      country: US
                      postal_code: 98161-1001
                      administrative_district_level_1: Washington
                    site_url: 'http://example.com'
                    metadata:
                      key: value
                    default_fee_plans:
