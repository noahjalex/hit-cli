      x-tags:
        - Merchants
      type: object
      title: 'Event: merchant.status.updated'
      description: |-
        **When is this event triggered?**

        This event is created whenever a merchant's status is changed. The status change can be due to do many different things:
          - An API client-initiated action to disable / enable the merchant
          - An asynchronous merchant registration process completing, moving the merchant from pending to active
          - A compliance ban on the merchant, moving them to disabled
      properties:
        type:
          type: string
          description: The type of event that occurred. `merchant.status.updated` for this event.
          example: merchant.status.updated
        event_id:
          type: string
          description: A unique identifier provided by Cash App for the event.
          example: WE_78lusoltpu8r9shziq5hdnx96
        created_at:
          type: string
          format: date-time
          description: |-
            When this event occured in [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339) format (UTC).

            The time that the event is delivered may be significantly later than this timestamp due to webhooks being retried for up to 72 hours.
          example: '2022-12-07T20:21:46.282Z'
        data:
          description: Data about the merchant that had a status change.
          type: object
          required:
            - id
            - object
            - type
          properties:
            id:
              type: string
              description: A unique identifier provided by Cash App for the merchant.
              example: MMI_4vxs5egfk7hmta3qx2h6rp91x
            object:
              description: A snapshot of the merchant data immediately after the merchant's status changed.
              type: object
              required:
                - merchant
              properties:
                merchant:
                  $ref: '#/components/schemas/Merchant'
            type:
              type: string
              description: 'The resource type contained in the `object` field. For this event, it is `merchant`.'
              example: merchant
      required:
        - type
        - event_id
        - created_at
        - data
