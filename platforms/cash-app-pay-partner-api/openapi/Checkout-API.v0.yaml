    LoanUnavailableReasonCodes:
      title: LoanUnavailableReasonCodes
      type: array
      description: |-
        List of enumerated codes corresponding to why loans are not available for the customer. This list will be empty if loan_availability is AVAILABLE or DISABLED.

        Current values:
        - `AGE_INVALID`: The customer cannot access the loan products due to their age.
        - `IDV_FAILED`: The customer has not completed Identity Verification.
        - `STATE_NOT_SUPPORTED`: The customer's state or territory is not supported for the available loan products.
        - `LOANS_OVERDUE`: The customer has existing overdue loans.
        - `CREDIT_LIMIT_EXCEEDED`: The customer has exceeded their available credit limit.
        - `CART_AMOUNT_INVALID`: The checkout amount is not valid for the available loan products.
        - `APP_VERSION_INVALID`: The customer's app version cannot access the available loan products.
        - `MISSING_PHONE_OR_EMAIL`: The customer's account does not have a phone and email attached.
        - `ADVERSE_ACTION_REASONS`: There are loan products available but the customer is not eligible.
        - `BLOCK_EMPLOYEE`: The customer is an employee of Block.
        - `ACCOUNT_INACTIVE`: The customer's account is inactive.
        - `GENERIC`: The reason for loan unavailablility is unknown.
        - `UNKNOWN_APPLICATION_DENIED_REASON`: The reason for loan unavailability is unknown.
        - `CUSTOMER_HAS_MAXIMUM_PERMITTED_LOANS`: The customer has taken out the maximum number of loans for the lending product.
        - `REPAYMENT_DELAY_DAYS_EXCEEDS_MAX`: The requested repayment delay exceeds the maximum repayment delay for this lending product.
        - `TAX_REFUND_ADV_ALREADY_EXISTS`: The customer is only allowed a single tax refund advance loan in a given tax season.
        - `NOT_AVAILABLE_IN_LOCALITY`: The lending product is not available in the customer's locality.
        - `CUSTOMER_MISSING_ADDRESS`: The customer address was not able to be determined.
      items:
        type: string
