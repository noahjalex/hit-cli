  '/orders/{order_id}/payment-plan':
    parameters:
      - schema:
          type: string
        name: order_id
        in: path
        required: true
        description: The ID of the order to retrieve.
        example: ORD_12345
    post:
      summary: Create PaymentPlans
      operationId: create-payment-plans
      requestBody:
        content:
          application/json: {}
      responses:
        '201':
          description: Payment plan created
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_plans:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentPlanProjection'
                  loan_unavailable_reason_codes:
                    $ref: '#/components/schemas/LoanUnavailableReasonCodes'
                required:
                  - payment_plans
                  - loan_unavailable_reason_codes
              examples:
                Nil Payment Plan:
                  value:
                    payment_plans: []
                    loan_unavailable_reason_codes: []
                Standard Payment Plan:
                  value:
                    payment_plans:
                      - due_today:
                          amount: 2575
                          currency: USD
                        finance_charge:
                          amount: 300
                          currency: USD
                        id: mockPaymentPlanPayin4-1
                        schedule:
                          - amount:
                              amount: 2575
                              currency: USD
                            payment_date: '2022-04-12'
                          - amount:
                              amount: 2575
                              currency: USD
                            payment_date: '2022-04-26'
                          - amount:
                              amount: 2575
                              currency: USD
                            payment_date: '2022-05-10'
                      - due_today:
                          amount: 5100
                          currency: USD
                        finance_charge:
                          amount: 200
                          currency: USD
                        id: mockPaymentPlanPayin2-1
                        schedule:
                          - amount:
                              amount: 5100
                              currency: USD
                            payment_date: '2022-05-10'
                    loan_unavailable_reason_codes: []
                Large Downpayment Payment Plan:
                  value:
                    payment_plans:
                      - due_today:
                          amount: 4300
                          currency: USD
                        finance_charge:
                          amount: 300
                          currency: USD
                        id: mockPaymentPlanPayin4-1
                        schedule:
                          - amount:
                              amount: 2000
                              currency: USD
                            payment_date: '2022-04-12'
                          - amount:
                              amount: 2000
                              currency: USD
                            payment_date: '2022-04-26'
                          - amount:
                              amount: 2000
                              currency: USD
                            payment_date: '2022-05-10'
                      - due_today:
                          amount: 5100
                          currency: USD
                        finance_charge:
                          amount: 200
                          currency: USD
                        id: mockPaymentPlanPayin2-1
                        schedule:
                          - amount:
                              amount: 5100
                              currency: USD
                            payment_date: '2022-05-10'
                    loan_unavailable_reason_codes: []
      description: |-
        Retrieves available payment plans by an order ID.

        Financing details are projection.
  '/orders/{order_id}/denial-reason':
    parameters:
      - schema:
          type: string
        name: order_id
        in: path
        required: true
        example: ORD_12345
        description: The ID of the order.
    get:
      summary: Retrieve Denial Reason
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  denial_reason_message:
                    type: string
                    description: 'A message to display to the customer, describing why their loan application was denied.'
              examples:
                Customer with denied loan application:
                  value:
                    denial_reason_message: This option isn't available to people under 18.
                No denial_reason_message:
                  value: {}
      operationId: denied-reason
      description: Retrieve loan application denial details.
  '/orders/{order_id}/confirm':
    parameters:
      - schema:
          type: string
        name: order_id
        in: path
        required: true
        description: The ID of the order to confirm.
        example: ORD_12345
    post:
      summary: Confirm Checkout
      operationId: confirm-checkout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  request:
                    $ref: ./Customer-Request-API.v1.yaml#/components/schemas/Request
                required:
                  - order
                  - request
              examples: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid request:
                  value:
                    errors:
                      - category: INVALID_REQUEST_ERROR
                        code: INVALID_CONTENT_TYPE
                        detail: "The Content-Type header must be `application/json`. The provided Content-Type was: '`null`'."
      description: Confirm a checkout by ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderConfirmRequest'
  '/orders/{order_id}/cancel':
    parameters:
      - schema:
          type: string
        name: order_id
        description: The ID of the order.
        in: path
        required: true
    post:
      summary: Cancel Checkout
      operationId: cancel-checkout
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: 'The actual response body is empty, so this empty schema allows "anything"'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid request:
                  value:
                    errors:
                      - category: INVALID_REQUEST_ERROR
                        code: INVALID_CONTENT_TYPE
                        detail: "The Content-Type header must be `application/json`. The provided Content-Type was: '`null`'."
      description: Cancel a checkout by ID.
components:
  schemas:
    Address:
      type: object
      title: Address
      x-stoplight:
        id: f3fsqfj2yj1kn
      additionalProperties: false
      properties:
        address_line_1:
          type: string
          description: |-
            First line of the street address, typically including street number, street name, and / or building name.

            Min length: `1`
            Max length: `1024`
          example: 1215 4th Ave
          minLength: 1
          maxLength: 1024
        address_line_2:
          type: string
          description: |-
            Second line of the address, if any.

            Min length: `1`
            Max length: `1024`
          example: Suite 2300
          minLength: 1
          maxLength: 1024
        locality:
          type: string
          description: |-
            City or township where the entity is located.

            Min length: `1`
            Max length: `1024`
          minLength: 1
          maxLength: 1024
          example: Seattle
        country:
          $ref: '#/components/schemas/Country'
        postal_code:
          type: string
          description: |-
            ZIP or postal code.

            Min length: `1`
            Max length: `128`
          example: 98161-1001
          minLength: 1
          maxLength: 128
        administrative_district_level_1:
          type: string
          description: |-
            State or province.

            Min length: `1`
            Max length: `1024`
          example: Washington
          minLength: 1
          maxLength: 1024
      required:
        - country
    CardPaymentMethod:
      title: Card Payment Method
      x-stoplight:
        id: wxpfwqbujgord
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the given payment method.
        type:
          type: string
          enum:
            - CARD
          example: CARD
        provider:
          type: string
          description: Cash balance or card issuer's name.
          example: Wells Fargo
        provider_logo_src:
          type: string
          format: uri
        masked_pan:
          type: string
          example: '1234'
        card_brand:
          type: string
          enum:
            - MASTERCARD
            - VISA
            - AMEX
      required:
        - id
        - type
        - provider
        - masked_pan
        - card_brand
    CashBalancePaymentMethod:
      title: Cash Balance Payment Method
      x-stoplight:
        id: uhvboiufyr1x4
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the given payment method.
        type:
          type: string
          enum:
            - CASH_BALANCE
          example: CASH_BALANCE
        provider:
          type: string
          description: Cash balance or card issuer's name.
          example: Cash balance
        provider_logo_src:
          type: string
          format: uri
        masked_pan:
          type: string
          example: '1234'
      required:
        - id
        - type
        - provider
        - masked_pan
    Country:
      type: string
      title: Country
      x-stoplight:
        id: ig0127ph388g3
      description: |-
        Indicates the country associated with an entity. Values are from the [ISO-3166 Alpha-2](https://www.iso.org/iso-3166-country-codes.html) specification.

        Current values:

        - `US`: United States of America
      example: US
      enum:
        - US
    Currency:
      type: string
      title: Currency
      x-stoplight:
        id: is7r4j34f9uq6
      description: |-
        Indicates the country associated with an entity. Values are from the [ISO-4217 Alpha-3](https://www.iso.org/iso-4217-currency-codes.html) specification.

        Current values:

        - `USD`: United States Dollar
      pattern: '[A-Z]'
      enum:
        - USD
      example: USD
    LineItem:
      title: Line Item
      x-stoplight:
        id: iuaki8vbl9193
      type: object
      properties:
        name:
          type: string
        quantity:
          type: integer
          example: 1
        price:
          $ref: '#/components/schemas/Money'
        image_src:
          type: string
          format: uri
      required:
        - name
        - quantity
    LoanRequest:
      title: Loan Request
      x-stoplight:
        id: ft2oqv85xq0l7
      type: object
      properties:
        id:
          type: string
          description: Unique Payment Plan Identifier.
        idempotency_key:
          type: string
          maxLength: 192
          description: |-
            A value you specify that uniquely identifies this loan request.

            If you are unsure whether a particular loan was created successfully, you can reattempt it with the same idempotency key without worrying about creating duplicate loan creation.
      required:
        - id
        - idempotency_key
    Loan:
      title: Loan
      x-stoplight:
        id: 9ufskcf6un8nm
      type: object
      description: 'Note: Not finalised'
      properties:
        due_today:
          $ref: '#/components/schemas/Money'
        grand_total:
          $ref: '#/components/schemas/Money'
        id:
          type: string
          description: Unique Payment Plan Identifier.
