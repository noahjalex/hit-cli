openapi: 3.1.0
x-stoplight:
  id: 7cc1c48313fd8
info:
  title: Checkout API
  version: '0.0'
  contact:
    name: Cash App
    url: 'https://developers.cash.app'
    email: developers@cash.app
  description: The Cash App Checkout API connects clients to Cash App customers to process purchase order.
servers:
  - url: 'https://api.cash.app/checkout/v0'
    description: Production
  - url: 'https://sandbox.api.cash.app/checkout/v0'
    description: Sandbox
paths:
  /orders:
    post:
      summary: Create Checkout
      operationId: create-checkout
      responses:
        '201':
          description: Checkout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                  request:
                    $ref: ./Customer-Request-API.v1.yaml#/components/schemas/Request
                  loan_availability:
                    type: string
                    description: |-
                      The status loan availability specific to this Checkout instance.

                      Current values:
                      - `AVAILABLE`: The lending and installment product is available. An additional credit check may be required for the customer to continue with a payment-plan.
                      - `NOT_AVAILABLE`: The lending and installment product is not available.
                      - `DISABLED`: BNPL is disabled and should not be shown to the customer.
                  loan_unavailable_reason_codes:
                    $ref: '#/components/schemas/LoanUnavailableReasonCodes'
                required:
                  - order
                  - request
                  - loan_availability
                  - loan_unavailable_reason_codes
              examples:
                Loan Unavailable:
                  value:
                    order:
                      id: mockedOrderId
                      version: 0
                      total_order:
                        amount: 10000
                        currency: USD
                    request:
                      id: GRR_1hrxhz136krcq6ezdte2ha5q
                      status: PROCESSING
                      actions:
                        - amount: 10000
                          currency: USD
                          scope_id: MMI_4vxs5egfk7hmta3qx2h6rp91x
                          type: ONE_TIME_PAYMENT
                      redirect_url: 'https://example.com'
                      created_at: '2022-01-01T12:09:00Z'
                      updated_at: '2022-01-01T12:10:00Z'
                      expires_at: '2033-01-01T12:20:00Z'
                      origin:
                        type: DIRECT
                      channel: ONLINE
                      reference_id: external-id
                      requester_profile:
                        name: The Sill
                        logo_url: 'https://picsum.photos/200'
                    loan_availability: NOT_AVAILABLE
                    loan_unavailable_reason_codes:
                      - CREDIT_LIMIT_EXCEEDED
                Loan Available:
                  value:
                    order:
                      id: mockedOrderId
                      version: 0
                      total_order:
                        amount: 10000
                        currency: USD
                    request:
                      id: GRR_1hrxhz136krcq6ezdte2ha5q
                      status: PROCESSING
                      actions:
                        - amount: 10000
                          currency: USD
                          scope_id: MMI_4vxs5egfk7hmta3qx2h6rp91x
                          type: ONE_TIME_PAYMENT
                      redirect_url: 'https://example.com'
                      created_at: '2022-01-01T12:09:00Z'
                      updated_at: '2022-01-01T12:10:00Z'
                      expires_at: '2033-01-01T12:20:00Z'
                      origin:
                        type: DIRECT
                      channel: ONLINE
                      reference_id: external-id
                      requester_profile:
                        name: The Sill
                        logo_url: 'https://picsum.photos/200'
                    loan_availability: AVAILABLE
                    loan_unavailable_reason_codes: []
                Loan Disabled:
                  value:
                    order:
                      id: mockedOrderId
                      version: 0
                      total_order:
                        amount: 10000
                        currency: USD
                    request:
                      id: GRR_1hrxhz136krcq6ezdte2ha5q
                      status: PROCESSING
                      actions:
                        - amount: 10000
                          currency: USD
                          scope_id: MMI_4vxs5egfk7hmta3qx2h6rp91x
                          type: ONE_TIME_PAYMENT
                      redirect_url: 'https://example.com'
                      created_at: '2022-01-01T12:09:00Z'
                      updated_at: '2022-01-01T12:10:00Z'
                      expires_at: '2033-01-01T12:20:00Z'
                      origin:
                        type: DIRECT
                      channel: ONLINE
                      reference_id: external-id
                      requester_profile:
                        name: The Sill
                        logo_url: 'https://picsum.photos/200'
                    loan_availability: DISABLED
                    loan_unavailable_reason_codes: []
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid request:
                  value:
                    errors:
                      - category: INVALID_REQUEST_ERROR
                        code: INVALID_CONTENT_TYPE
                        detail: "The Content-Type header must be `application/json`. The provided Content-Type was: '`null`'."
      description: 'Create a new Checkout, where a Checkout is an augmentation of an Order with CustomerRequest and Loan data.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key:
                  $ref: ./Network-API.v1.yaml#/components/schemas/IdempotencyKey
                customer_request_id:
                  type: string
                  description: |-
                    A unique identifier for the customer request issued by Cash App.

                    Min length: `1`
                    Max length: `128`
              required:
                - idempotency_key
                - customer_request_id
            examples: {}
          application/xml:
            schema:
              type: object
              properties: {}
  '/orders/{order_id}':
    parameters:
      - schema:
          type: string
        name: order_id
        in: path
        required: true
        description: The ID of the order.
        example: ORD_12345
    get:
      summary: Retrieve order
      responses:
        '200':
          description: Order Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  order:
                    $ref: '#/components/schemas/Order'
                required:
                  - order
              examples: {}
        '404':
          description: Order Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Invalid request:
                  value:
                    errors:
                      - category: INVALID_REQUEST_ERROR
                        code: NOT_FOUND
                        detail: The requested order could not be found.
      operationId: retrieve-order
      description: Retrives an Order by ID.
